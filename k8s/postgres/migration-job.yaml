# Migration Job for running Alembic migrations
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  namespace: rag-pipeline
  labels:
    app: postgres-migrate
    component: database
  annotations:
    description: "Run database migrations using Alembic"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: postgres-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgres 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 5
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: migrate
          image: rag-pipeline/ingestion-service:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: database-url
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "[$(date)] Running database migrations..."
              cd /app
              alembic upgrade head
              echo "[$(date)] Migrations completed successfully"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
