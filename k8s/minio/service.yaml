apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: rag-pipeline
  labels:
    app: minio
spec:
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: 9000
    name: api
    targetPort: 9000
  - port: 9001
    name: console
    targetPort: 9001
  selector:
    app: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: rag-pipeline
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
  - port: 9000
    name: api
    targetPort: 9000
  - port: 9001
    name: console
    targetPort: 9001
  selector:
    app: minio
