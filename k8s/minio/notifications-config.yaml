# MinIO Webhook Notifications Configuration
# ==========================================
# Configures MinIO to send webhook notifications on bucket events.
# Use to trigger ingestion pipeline on document uploads.

apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-notifications
  namespace: rag-pipeline
  labels:
    app: minio
    component: notifications
data:
  setup-notifications.sh: |
    #!/bin/sh
    set -e
    
    echo "=== MinIO Notifications Setup ==="
    
    MINIO_ALIAS="${MINIO_ALIAS:-rag}"
    WEBHOOK_ENDPOINT="${WEBHOOK_ENDPOINT:-http://ingestion-service:8001/webhooks/minio}"
    WEBHOOK_AUTH_TOKEN="${WEBHOOK_AUTH_TOKEN:-}"
    
    # Configure webhook endpoint
    echo "Configuring webhook endpoint..."
    
    if [ -n "$WEBHOOK_AUTH_TOKEN" ]; then
      mc admin config set $MINIO_ALIAS notify_webhook:ingestion \
        endpoint="$WEBHOOK_ENDPOINT" \
        auth_token="$WEBHOOK_AUTH_TOKEN"
    else
      mc admin config set $MINIO_ALIAS notify_webhook:ingestion \
        endpoint="$WEBHOOK_ENDPOINT"
    fi
    
    # Restart MinIO to apply config
    echo "Restarting MinIO to apply configuration..."
    mc admin service restart $MINIO_ALIAS
    
    # Wait for MinIO to be ready
    sleep 10
    
    # Add event notification for raw-documents bucket
    echo "Adding event notifications for raw-documents..."
    
    # Notify on PUT (new uploads)
    mc event add $MINIO_ALIAS/raw-documents \
      arn:minio:sqs::ingestion:webhook \
      --event put \
      --suffix ".pdf,.docx,.doc,.txt,.md,.html,.json,.csv,.xlsx,.pptx" || \
      echo "Event may already be configured"
    
    # Notify on DELETE (document removal)
    mc event add $MINIO_ALIAS/raw-documents \
      arn:minio:sqs::ingestion:webhook \
      --event delete || \
      echo "Event may already be configured"
    
    # List configured events
    echo ""
    echo "Configured events for raw-documents:"
    mc event list $MINIO_ALIAS/raw-documents
    
    echo ""
    echo "=== Notifications Setup Complete ==="

---
# Job to apply notification configuration
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-notifications-setup
  namespace: rag-pipeline
  labels:
    app: minio
    component: notifications
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-notifications
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              until wget -q -O- http://minio:9000/minio/health/live 2>/dev/null; do
                echo "MinIO not ready, waiting..."
                sleep 5
              done
              echo "MinIO is ready!"
      containers:
        - name: setup
          image: minio/mc:RELEASE.2024-01-11T05-49-32Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: root-password
            - name: MINIO_ALIAS
              value: "rag"
            - name: WEBHOOK_ENDPOINT
              value: "http://ingestion-service:8001/webhooks/minio"
            - name: WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: minio-webhook-token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              # Configure alias
              mc alias set $MINIO_ALIAS http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              
              # Run setup script
              /scripts/setup-notifications.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: minio-notifications
            defaultMode: 0755
