---
# Grafana ConfigMap for main configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
data:
  grafana.ini: |
    [server]
    root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
    serve_from_sub_path = true

    [security]
    admin_user = admin
    admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
    disable_gravatar = true

    [users]
    allow_sign_up = false
    allow_org_create = false

    [auth.anonymous]
    enabled = false

    [analytics]
    reporting_enabled = false
    check_for_updates = false

    [log]
    mode = console
    level = info

    [alerting]
    enabled = true

    [unified_alerting]
    enabled = true

    [feature_toggles]
    enable = tempoSearch tempoBackendSearch tempoServiceGraph traceToMetrics

---
# Grafana Datasources ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: jaeger
              urlDisplayLabel: "View Trace"

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          maxLines: 5000
          derivedFields:
            - name: trace_id
              matcherRegex: '"trace_id":"([a-f0-9]+)"'
              url: "$${__value.raw}"
              datasourceUid: jaeger
              urlDisplayLabel: "View Trace"

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-query:16686
        editable: false
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            tags: ["service_name", "trace_id"]
            spanStartTimeShift: "1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
          nodeGraph:
            enabled: true

---
# Grafana Dashboard Provisioning ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'RAG Pipeline Dashboards'
        orgId: 1
        folder: 'RAG Pipeline'
        folderUid: 'rag-pipeline'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:10.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password
            - name: GF_INSTALL_PLUGINS
              value: "grafana-piechart-panel,grafana-clock-panel"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}

---
# Grafana Secret
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-password: "admin123"  # Change in production!

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana

---
# Grafana ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

---
# Grafana Dashboards ConfigMap
# Dashboards are stored in config/grafana/dashboards/ and referenced here
# To add new dashboards, create JSON files in config/grafana/dashboards/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
  annotations:
    description: "Grafana dashboards - see config/grafana/dashboards/ for full versions"
data:
  # SLO Overview Dashboard - monitors all SLOs with error budgets
  # Full dashboard at config/grafana/dashboards/slo-overview.json
  slo-overview.json: |
    {
      "annotations": {"list": []},
      "description": "SLO Overview Dashboard - Error budgets and burn rates",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {"expr": "slo:query_availability:error_budget_remaining * 100", "legendFormat": "Query Availability"}
          ],
          "title": "Query Availability Error Budget",
          "type": "stat"
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "slo:retrieval_latency_p95:error_budget_remaining * 100", "legendFormat": "Retrieval p95"}
          ],
          "title": "Retrieval Latency Error Budget",
          "type": "stat"
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "slo:rag_e2e_latency_p95:error_budget_remaining * 100", "legendFormat": "E2E p95"}
          ],
          "title": "E2E Latency Error Budget",
          "type": "stat"
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "avg(slo:tenant_error_rate:error_budget_remaining) * 100", "legendFormat": "Tenant Avg"}
          ],
          "title": "Tenant Error Budget (Avg)",
          "type": "stat"
        },
        {
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"expr": "slo:query_availability:ratio_5m", "legendFormat": "Availability (5m)"},
            {"expr": "slo:retrieval_latency_p95:ratio_5m", "legendFormat": "Retrieval Latency (5m)"},
            {"expr": "slo:rag_e2e_latency_p95:ratio_5m", "legendFormat": "E2E Latency (5m)"}
          ],
          "title": "SLI Ratios Over Time",
          "type": "timeseries"
        },
        {
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"expr": "slo:tenant_error_rate:ratio_5m", "legendFormat": "{{tenant_id}}"}
          ],
          "title": "Tenant Error Rate by Tenant",
          "type": "timeseries"
        },
        {
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 12},
          "id": 7,
          "options": {"footer": {"show": false}, "showHeader": true},
          "targets": [
            {"expr": "topk(10, slo:tenant_error_rate:error_budget_remaining)", "format": "table", "instant": true}
          ],
          "title": "Tenant Error Budget Remaining",
          "type": "table",
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["slo", "rag-pipeline"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "SLO Overview",
      "uid": "slo-overview",
      "version": 1,
      "weekStart": ""
    }
  # Verification Dashboard - monitors answer verification quality (US-10.4.2)
  verification.json: |
    {
      "annotations": {"list": []},
      "description": "Answer Verification Dashboard - Quality metrics and trends",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {"expr": "sum(rate(rag_verification_label_total{label=\"supported\"}[5m])) / sum(rate(rag_verification_label_total{label!=\"skipped\"}[5m])) * 100", "legendFormat": "Success Rate"}
          ],
          "title": "Verification Success Rate",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "green", "value": 90}
                ]
              }
            }
          }
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "histogram_quantile(0.5, sum(rate(rag_verification_score_bucket[5m])) by (le))", "legendFormat": "Median Score"}
          ],
          "title": "Median Verification Score",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 0.7},
                  {"color": "green", "value": 0.9}
                ]
              }
            }
          }
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(rag_verification_latency_seconds_bucket[5m])) by (le)) * 1000", "legendFormat": "p95 Latency"}
          ],
          "title": "Verification Latency (p95)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 500},
                  {"color": "red", "value": 1000}
                ]
              }
            }
          }
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "sum(increase(rag_verification_label_total[24h]))", "legendFormat": "Total"}
          ],
          "title": "Verifications (24h)",
          "type": "stat"
        },
        {
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"expr": "sum(rate(rag_verification_label_total{label=\"supported\"}[5m])) / sum(rate(rag_verification_label_total{label!=\"skipped\"}[5m])) * 100", "legendFormat": "Supported"},
            {"expr": "sum(rate(rag_verification_label_total{label=\"partial\"}[5m])) / sum(rate(rag_verification_label_total{label!=\"skipped\"}[5m])) * 100", "legendFormat": "Partial"},
            {"expr": "sum(rate(rag_verification_label_total{label=\"unsupported\"}[5m])) / sum(rate(rag_verification_label_total{label!=\"skipped\"}[5m])) * 100", "legendFormat": "Unsupported"}
          ],
          "title": "Verification Success Rate Over Time",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        },
        {
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"expr": "histogram_quantile(0.5, sum(rate(rag_verification_score_bucket[5m])) by (le))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.75, sum(rate(rag_verification_score_bucket[5m])) by (le))", "legendFormat": "p75"},
            {"expr": "histogram_quantile(0.95, sum(rate(rag_verification_score_bucket[5m])) by (le))", "legendFormat": "p95"}
          ],
          "title": "Score Distribution Over Time",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          }
        },
        {
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 12},
          "id": 7,
          "options": {
            "legend": {"displayMode": "list", "placement": "right"},
            "pieType": "pie",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {"expr": "sum(increase(rag_verification_label_total{label!=\"skipped\"}[24h])) by (label)", "legendFormat": "{{label}}"}
          ],
          "title": "Verification Labels (24h)",
          "type": "piechart"
        },
        {
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 12},
          "id": 8,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"expr": "sum(rate(rag_verification_claims_total{status=\"supported\"}[5m]))", "legendFormat": "Supported"},
            {"expr": "sum(rate(rag_verification_claims_total{status=\"partial\"}[5m]))", "legendFormat": "Partial"},
            {"expr": "sum(rate(rag_verification_claims_total{status=\"unsupported\"}[5m]))", "legendFormat": "Unsupported"}
          ],
          "title": "Claims by Status Over Time",
          "type": "timeseries"
        },
        {
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 12},
          "id": 9,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"expr": "histogram_quantile(0.5, sum(rate(rag_verification_latency_seconds_bucket[5m])) by (le)) * 1000", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum(rate(rag_verification_latency_seconds_bucket[5m])) by (le)) * 1000", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.99, sum(rate(rag_verification_latency_seconds_bucket[5m])) by (le)) * 1000", "legendFormat": "p99"}
          ],
          "title": "Verification Latency Over Time",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          }
        },
        {
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 20},
          "id": 10,
          "options": {"footer": {"show": false}, "showHeader": true},
          "targets": [
            {"expr": "sum(increase(rag_verification_label_total{label!=\"skipped\"}[24h])) by (tenant_id, label)", "format": "table", "instant": true}
          ],
          "title": "Verification by Tenant (24h)",
          "type": "table",
          "transformations": [
            {"id": "organize", "options": {"excludeByName": {"Time": true}}}
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["verification", "rag-pipeline", "quality"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Answer Verification",
      "uid": "verification",
      "version": 1,
      "weekStart": ""
    }
