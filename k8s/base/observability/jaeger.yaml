---
# Jaeger All-in-One for Development
# For production, use Jaeger Operator or Tempo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: rag-pipeline
  labels:
    app: jaeger
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        component: observability
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.53
          env:
            # Memory storage (development only)
            - name: SPAN_STORAGE_TYPE
              value: memory
            # OTLP receiver configuration
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Sampling configuration
            - name: SAMPLING_STRATEGIES_FILE
              value: /etc/jaeger/sampling.json
            # Query service
            - name: QUERY_BASE_PATH
              value: /jaeger
          ports:
            # Collector ports
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 14268
              name: http-collector
              protocol: TCP
            - containerPort: 14250
              name: grpc-collector
              protocol: TCP
            # Query/UI port
            - containerPort: 16686
              name: query
              protocol: TCP
            # Admin port
            - containerPort: 14269
              name: admin
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: sampling-config
              mountPath: /etc/jaeger
          livenessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: sampling-config
          configMap:
            name: jaeger-sampling-config

---
# Jaeger Sampling Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling-config
  namespace: rag-pipeline
  labels:
    app: jaeger
    component: observability
data:
  sampling.json: |
    {
      "service_strategies": [
        {
          "service": "ingestion-service",
          "type": "probabilistic",
          "param": 0.5
        },
        {
          "service": "retrieval-service",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "orchestrator-service",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "llm-gateway",
          "type": "probabilistic",
          "param": 1.0
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      }
    }

---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: rag-pipeline
  labels:
    app: jaeger
    component: observability
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: http-collector
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: grpc-collector
      port: 14250
      targetPort: 14250
      protocol: TCP
  selector:
    app: jaeger

---
# Jaeger Collector Service (for OTEL Collector to send to)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: rag-pipeline
  labels:
    app: jaeger
    component: observability
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: grpc-collector
      port: 14250
      targetPort: 14250
      protocol: TCP
  selector:
    app: jaeger

---
# Jaeger Query Service (for UI access)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: rag-pipeline
  labels:
    app: jaeger
    component: observability
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      protocol: TCP
  selector:
    app: jaeger
