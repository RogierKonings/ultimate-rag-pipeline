---
# Alertmanager ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: 'slack-default'
      group_by: ['alertname', 'service', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
          continue: true
        - match:
            severity: warning
          receiver: 'slack-warning'
        - match:
            alerttype: slo_burn_rate
          receiver: 'slack-slo'
          group_by: ['alertname', 'slo']

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

    receivers:
      - name: 'slack-default'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#rag-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Service:* {{ .Labels.service }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}

      - name: 'slack-critical'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#rag-alerts-critical'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] CRITICAL: {{ .GroupLabels.alertname }}'
            color: 'danger'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Service:* {{ .Labels.service }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}

      - name: 'slack-warning'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#rag-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            color: 'warning'
            text: |
              {{ range .Alerts }}
              *Summary:* {{ .Annotations.summary }}
              {{ end }}

      - name: 'slack-slo'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#rag-slo-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] SLO: {{ .GroupLabels.slo }}'
            text: |
              {{ range .Alerts }}
              *SLO:* {{ .Labels.slo }}
              *Burn Rate:* {{ .Labels.burn_rate }}x
              *Window:* {{ .Labels.window }}
              *Summary:* {{ .Annotations.summary }}
              {{ .Annotations.recommended_actions }}
              {{ end }}

---
# Alertmanager Secret for Slack webhook
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: alertmanager
type: Opaque
stringData:
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"  # Replace in production

---
# Alertmanager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: alerting
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yaml
            - --storage.path=/alertmanager
            - --web.external-url=http://alertmanager:9093
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: alertmanager-secrets
        - name: data
          emptyDir: {}

---
# Alertmanager Service
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: alertmanager

---
# Alertmanager ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

---
# PrometheusRule for RAG alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rag-alert-rules
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: alerting
spec:
  groups:
    - name: rag-application-alerts
      interval: 30s
      rules:
        - alert: RAGHighErrorRate
          expr: |
            sum(rate(rag_query_total{status="error"}[5m]))
            / sum(rate(rag_query_total[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
            service: rag-pipeline
          annotations:
            summary: "High error rate detected in RAG pipeline"
            description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

        - alert: RAGHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(rag_query_duration_seconds_bucket[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: rag-pipeline
          annotations:
            summary: "High latency detected in RAG pipeline"
            description: "P95 latency is {{ $value | humanizeDuration }}"

        - alert: RAGComponentUnhealthy
          expr: rag_component_health == 0
          for: 2m
          labels:
            severity: critical
            service: rag-pipeline
          annotations:
            summary: "RAG component {{ $labels.component }} is unhealthy"
            description: "Component has been unhealthy for 2 minutes"

    - name: slo-burn-rate-alerts
      interval: 30s
      rules:
        - alert: QueryAvailabilityFastBurn
          expr: |
            (
              (1 - (sum(rate(rag_query_total{status="success"}[1h])) / sum(rate(rag_query_total[1h]))))
              / 0.001
            ) > 14.4
          for: 2m
          labels:
            severity: critical
            alerttype: slo_burn_rate
            slo: query_availability
            burn_rate: "14.4"
          annotations:
            summary: "Query availability SLO burning fast"
            description: "Error budget consumption rate is 14.4x normal"
