# =============================================================================
# Database Security Secrets Template
# =============================================================================
#
# This file contains templates for database security configuration.
# For production, replace placeholder values with actual secrets using:
#   - Sealed Secrets (kubeseal)
#   - External Secrets Operator
#   - HashiCorp Vault
#   - Cloud provider secret managers
#
# Environment variables with ${...} syntax should be replaced by your
# secrets management solution before applying to production.
#
# See: workflow/refined/10-architectural-improvements/US-10.7.2-database-security-enablement.md
# =============================================================================

---
# PostgreSQL Credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Database connection (password passed separately for logging safety)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ragpipeline"
  POSTGRES_USER: "raguser"
  # For production: inject from secrets manager
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  # SSL configuration
  # Options: disable, require, verify-ca, verify-full (recommended for production)
  POSTGRES_SSL_MODE: "verify-full"

  # Paths to SSL certificates (mounted via database-tls-certs secret)
  POSTGRES_SSL_CA: "/tls/postgres/ca.crt"
  # Optional: for mutual TLS (client certificate authentication)
  POSTGRES_SSL_CERT: "/tls/postgres/tls.crt"
  POSTGRES_SSL_KEY: "/tls/postgres/tls.key"

---
# Redis Credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # For production: inject from secrets manager
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # TLS configuration
  REDIS_TLS_ENABLED: "true"
  REDIS_TLS_CA_CERT: "/tls/redis/ca.crt"
  # Optional: for mutual TLS
  REDIS_TLS_CERT: "/tls/redis/tls.crt"
  REDIS_TLS_KEY: "/tls/redis/tls.key"

---
# OpenSearch Credentials
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: search
type: Opaque
stringData:
  OPENSEARCH_URL: "https://opensearch:9200"
  OPENSEARCH_INDEX: "documents"
  OPENSEARCH_USERNAME: "rag_app"
  # For production: inject from secrets manager
  OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD}"

  # SSL configuration
  OPENSEARCH_USE_SSL: "true"
  OPENSEARCH_VERIFY_CERTS: "true"
  OPENSEARCH_CA_CERT: "/tls/opensearch/ca.crt"
  # Optional: for mutual TLS
  OPENSEARCH_CLIENT_CERT: "/tls/opensearch/tls.crt"
  OPENSEARCH_CLIENT_KEY: "/tls/opensearch/tls.key"

---
# TLS Certificates Secret
# This secret should contain the actual certificate files
# For production: use cert-manager to automatically provision and rotate certificates
apiVersion: v1
kind: Secret
metadata:
  name: database-tls-certs
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: security
type: kubernetes.io/tls
data:
  # Base64 encoded certificates
  # For production: populate via cert-manager or external-secrets
  ca.crt: "${CA_CERT_BASE64}"
  tls.crt: "${CLIENT_CERT_BASE64}"
  tls.key: "${CLIENT_KEY_BASE64}"

---
# Service-specific TLS certificates (if using different certs per service)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-tls-certs
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: database
type: kubernetes.io/tls
data:
  ca.crt: "${POSTGRES_CA_CERT_BASE64}"
  tls.crt: "${POSTGRES_CLIENT_CERT_BASE64}"
  tls.key: "${POSTGRES_CLIENT_KEY_BASE64}"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-tls-certs
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: cache
type: kubernetes.io/tls
data:
  ca.crt: "${REDIS_CA_CERT_BASE64}"
  tls.crt: "${REDIS_CLIENT_CERT_BASE64}"
  tls.key: "${REDIS_CLIENT_KEY_BASE64}"

---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-tls-certs
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: search
type: kubernetes.io/tls
data:
  ca.crt: "${OPENSEARCH_CA_CERT_BASE64}"
  tls.crt: "${OPENSEARCH_CLIENT_CERT_BASE64}"
  tls.key: "${OPENSEARCH_CLIENT_KEY_BASE64}"
