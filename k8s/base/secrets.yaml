# =============================================================================
# DEVELOPMENT SECRETS ONLY - DO NOT USE IN PRODUCTION
# =============================================================================
#
# This file contains weak/default credentials for local development and testing.
#
# For production deployments, use one of these approaches:
#
# 1. Kustomize secretGenerator with SOPS encryption:
#    secretGenerator:
#      - name: rag-secrets
#        files:
#          - secrets.enc.yaml
#
# 2. HashiCorp Vault with vault-agent-injector:
#    See k8s/vault/vault-agent.yaml for configuration
#
# 3. External Secrets Operator:
#    apiVersion: external-secrets.io/v1beta1
#    kind: ExternalSecret
#    ...
#
# 4. Cloud provider secret managers:
#    - AWS Secrets Manager
#    - GCP Secret Manager
#    - Azure Key Vault
#
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/part-of: rag-pipeline
    environment: development
  annotations:
    description: "Development secrets - DO NOT USE IN PRODUCTION"
type: Opaque
stringData:
  # PostgreSQL (use pgbouncer:5432 for connection pooling)
  database-url: "postgresql://raguser:ragpass@pgbouncer:5432/ragpipeline"
  postgres-user: "raguser"
  postgres-password: "ragpass"
  
  # Redis
  redis-password: "ragredis"
  
  # MinIO/S3
  minio-access-key: "minioadmin"
  minio-secret-key: "minioadmin123"
  
  # Qdrant (empty = no auth, set for production)
  qdrant-api-key: ""
  
  # OpenSearch (change for production)
  opensearch-username: "admin"
  opensearch-password: "admin"
