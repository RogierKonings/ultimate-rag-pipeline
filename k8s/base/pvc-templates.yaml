# PVC Templates for RAG Pipeline
# ================================
# Standardized PersistentVolumeClaim templates for all stateful services.
# Storage class is parameterized for cloud-provider overlays.
#
# Usage:
#   - GKE: storageClassName will be patched to 'premium-rwo'
#   - EKS: storageClassName will be patched to 'encrypted-gp3'
#   - AKS: storageClassName will be patched to 'managed-csi-premium'

---
# PostgreSQL PVC - Document metadata and pipeline state
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: rag-pipeline
  labels:
    app: postgres
    component: database
    encryption: required
    data-classification: high
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""  # Patched by overlay
  resources:
    requests:
      storage: 100Gi

