apiVersion: v1
kind: ResourceQuota
metadata:
  name: rag-pipeline-quota
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: resource-quota
    app.kubernetes.io/part-of: rag-pipeline
spec:
  hard:
    # Compute resources
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    
    # Storage
    requests.storage: 500Gi
    persistentvolumeclaims: "20"
    
    # Object counts
    pods: "50"
    services: "20"
    secrets: "30"
    configmaps: "30"
    
    # GPU resources (if applicable)
    requests.nvidia.com/gpu: "4"
    limits.nvidia.com/gpu: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rag-pipeline-limits
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: limit-range
    app.kubernetes.io/part-of: rag-pipeline
spec:
  limits:
    # Default limits for containers without explicit resource specs
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "8"
        memory: "32Gi"
    
    # Pod-level limits
    - type: Pod
      max:
        cpu: "16"
        memory: "64Gi"
    
    # PVC limits
    - type: PersistentVolumeClaim
      min:
        storage: "1Gi"
      max:
        storage: "200Gi"
