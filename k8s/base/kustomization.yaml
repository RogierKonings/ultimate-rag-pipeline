apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-pipeline

resources:
  # Core resources
  - namespace.yaml
  - secrets.yaml
  - rbac.yaml
  - resource-quota.yaml
  - pod-disruption-budgets.yaml
  - gpu-nodepool.yaml
  # Application services
  - ../ingestion/
  - ../retrieval/
  - ../orchestrator/
  - ../embedding/
  - ../llm-gateway/
  # TLS and Ingress (US-1.9)
  # Note: cert-manager ClusterIssuers are cluster-scoped,
  # apply them separately: kubectl apply -f ../cert-manager/cluster-issuers.yaml
  - ../ingress/
  - ../network-policies/
  # Certificate resources for rag-pipeline namespace
  - ../cert-manager/certificates.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: rag-pipeline
      app.kubernetes.io/managed-by: kustomize
