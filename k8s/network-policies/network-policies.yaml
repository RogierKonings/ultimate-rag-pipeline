# NetworkPolicies for RAG Pipeline Namespace
# ===========================================
# These policies implement namespace isolation and restrict
# ingress/egress to only necessary service ports.
#
# Services and Ports:
# - PostgreSQL: 5432
# - PgBouncer: 5432 (connection pooling)
# - Qdrant: 6333 (HTTP), 6334 (gRPC)
# - OpenSearch: 9200 (HTTP), 9300 (transport)
# - Redis: 6379
# - MinIO: 9000 (API), 9001 (Console)
# - OTEL Collector: 4317 (gRPC), 4318 (HTTP)
# - Prometheus: 9090
# - Application Services: 8001-8004
#
# Verification:
# kubectl exec test-pod -- nc -zv <service> <port>
# ===========================================

---
# Default deny all ingress and egress traffic
# All pods must explicitly allow traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: default-deny-all
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: allow-dns
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow ingress from nginx ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: allow-ingress-controller
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 8004

---
# PostgreSQL Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: postgres-policy
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from PgBouncer
    - from:
        - podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - protocol: TCP
          port: 5432
    # Allow from application services (for migrations/direct access)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow responses
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432

---
# PgBouncer Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-policy
  namespace: rag-pipeline
  labels:
