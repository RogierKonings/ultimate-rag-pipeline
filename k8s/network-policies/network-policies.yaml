---
# vLLM/Embedding Service Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-service-policy
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: llm-service-policy
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from orchestrator-service
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator-service
      ports:
        - protocol: TCP
          port: 8000
    # Allow from LLM Gateway
    - from:
        - podSelector:
            matchLabels:
              app: llm-gateway
      ports:
        - protocol: TCP
          port: 8000
    # Allow from ingestion-service (embedding generation)
    - from:
        - podSelector:
            matchLabels:
              app: ingestion-service
      ports:
        - protocol: TCP
          port: 8000
    # Allow from retrieval-service (reranking)
    - from:
        - podSelector:
            matchLabels:
              app: retrieval-service
      ports:
        - protocol: TCP
          port: 8000
    # Allow from Celery workers
    - from:
        - podSelector:
            matchLabels:
              app: celery-worker
      ports:
        - protocol: TCP
          port: 8000
    # Allow from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow outbound for model downloads (HuggingFace)
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# Allow Prometheus scraping from monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: allow-prometheus-scraping
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 8004
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9100
