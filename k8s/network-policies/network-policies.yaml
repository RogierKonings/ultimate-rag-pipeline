---
# Qdrant Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-policy
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: qdrant-policy
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingestion-service (write vectors)
    - from:
        - podSelector:
            matchLabels:
              app: ingestion-service
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
    # Allow from retrieval-service (read vectors)
    - from:
        - podSelector:
            matchLabels:
              app: retrieval-service
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
    # Allow Qdrant cluster communication
    - from:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
        - protocol: TCP
          port: 6335
  egress:
    # Allow Qdrant cluster communication
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
        - protocol: TCP
          port: 6335

---
# OpenSearch Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-policy
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: opensearch-policy
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingestion-service (index documents)
    - from:
        - podSelector:
            matchLabels:
              app: ingestion-service
      ports:
        - protocol: TCP
          port: 9200
    # Allow from retrieval-service (search)
    - from:
        - podSelector:
            matchLabels:
              app: retrieval-service
      ports:
        - protocol: TCP
          port: 9200
    # Allow OpenSearch cluster communication
    - from:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300
  egress:
    # Allow OpenSearch cluster communication
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300

---
# Redis Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: redis-policy
    app.kubernetes.io/part-of: rag-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from all application services (caching, task queue)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 6379
    # Allow from Celery workers
    - from:
        - podSelector:
            matchLabels:
              app: celery-worker
      ports:
        - protocol: TCP
          port: 6379
    # Allow Redis Sentinel communication
    - from:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
  egress:
    # Allow Redis Sentinel communication
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379

---
