apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: rag-pipeline
  labels:
    app: embedding-service
    component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: embedding-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: embedding-service
        component: ml
    spec:
      containers:
        - name: embedding-service
          image: rag-embedding:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: EMBEDDING_HOST
              value: "0.0.0.0"
            - name: EMBEDDING_PORT
              value: "8080"
            - name: EMBEDDING_MODEL
              value: "BAAI/bge-small-en-v1.5"
            - name: EMBEDDING_BATCH_SIZE
              value: "32"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
