apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: rag-pipeline
  labels:
    app: llm-gateway
    component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: llm-gateway
        component: ml
    spec:
      containers:
        - name: llm-gateway
          image: rag-llm-gateway:latest
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: RUST_LOG
              value: "info,rag_llm_gateway=debug"
            - name: LLM_GATEWAY_HOST
              value: "0.0.0.0"
            - name: LLM_GATEWAY_PORT
              value: "8004"
            - name: VLLM_URL
              value: "http://vllm:8000"
            - name: EMBEDDING_MODEL
              value: "sentence-transformers/all-MiniLM-L6-v2"
            - name: RERANKER_MODEL
              value: "BAAI/bge-reranker-v2-m3"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
