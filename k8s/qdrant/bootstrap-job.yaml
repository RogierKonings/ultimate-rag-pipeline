apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-bootstrap
  namespace: rag-pipeline
  labels:
    app: qdrant
    component: bootstrap
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: qdrant-bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Qdrant to be ready..."
              until wget -q -O- http://qdrant:6333/healthz 2>/dev/null; do
                echo "Qdrant not ready, waiting..."
                sleep 5
              done
              echo "Qdrant is ready!"
      containers:
        - name: bootstrap
          image: curlimages/curl:8.5.0
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: qdrant-api-key
                  optional: true
            - name: COLLECTION_NAME
              value: "documents"
            - name: EMBEDDING_DIM
              value: "1024"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "=== Qdrant Bootstrap Script ==="
              
              # Build auth header if API key is set
              AUTH_HEADER=""
              if [ -n "$QDRANT_API_KEY" ] && [ "$QDRANT_API_KEY" != "" ]; then
                AUTH_HEADER="-H \"api-key: $QDRANT_API_KEY\""
              fi
              
              # Check if collection exists
              echo "Checking if collection '$COLLECTION_NAME' exists..."
              COLLECTION_EXISTS=$(curl -s $QDRANT_URL/collections/$COLLECTION_NAME | grep -c '"status":"ok"' || true)
              
              if [ "$COLLECTION_EXISTS" -gt 0 ]; then
                echo "Collection '$COLLECTION_NAME' already exists"
                curl -s $QDRANT_URL/collections/$COLLECTION_NAME | head -200
              else
                echo "Creating collection '$COLLECTION_NAME' with HNSW settings..."
                
                curl -X PUT "$QDRANT_URL/collections/$COLLECTION_NAME" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "vectors": {
                      "size": '"$EMBEDDING_DIM"',
                      "distance": "Cosine",
                      "hnsw_config": {
                        "m": 16,
                        "ef_construct": 100,
                        "full_scan_threshold": 10000
                      },
                      "on_disk": true
                    },
                    "optimizers_config": {
                      "memmap_threshold": 20000,
                      "indexing_threshold": 20000,
                      "flush_interval_sec": 5
                    },
                    "on_disk_payload": true
                  }'
                
                echo ""
                echo "Collection created successfully"
              fi
              
              # Create payload indexes for efficient filtering
              echo ""
              echo "Creating payload indexes..."
              
              INDEXES="tenant_id document_id visibility"
              for field in $INDEXES; do
                echo "Creating index for '$field'..."
                curl -X PUT "$QDRANT_URL/collections/$COLLECTION_NAME/index" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "field_name": "'"$field"'",
                    "field_schema": "keyword"
                  }' 2>/dev/null || echo "Index may already exist"
              done
              
              # Create array index for allowed_groups
              echo "Creating index for 'allowed_groups'..."
              curl -X PUT "$QDRANT_URL/collections/$COLLECTION_NAME/index" \
                -H "Content-Type: application/json" \
                -d '{
                  "field_name": "allowed_groups",
                  "field_schema": "keyword"
                }' 2>/dev/null || echo "Index may already exist"
              
              # Verify collection
              echo ""
              echo "=== Collection Info ==="
              curl -s $QDRANT_URL/collections/$COLLECTION_NAME
              
              echo ""
              echo "=== Bootstrap Complete ==="
