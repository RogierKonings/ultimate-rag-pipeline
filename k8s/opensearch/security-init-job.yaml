# OpenSearch Security Initialization Job
# =======================================
# Runs the securityadmin tool to apply security configuration
# after OpenSearch starts with the security plugin enabled.

apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-security-init
  namespace: rag-pipeline
  labels:
    app: opensearch
    component: security-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: opensearch
        component: security-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: default
      containers:
        - name: securityadmin
          image: opensearchproject/opensearch:2.11.1
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "=== OpenSearch Security Initialization ==="
              
              # Wait for OpenSearch to be ready
              echo "Waiting for OpenSearch to be ready..."
              MAX_RETRIES=60
              RETRY_COUNT=0
              
              until curl -sk --connect-timeout 5 \
                --cacert /tls/ca.crt \
                https://opensearch.rag-pipeline.svc.cluster.local:9200 \
                -u admin:${ADMIN_PASSWORD} >/dev/null 2>&1; do
                
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: OpenSearch not ready after $MAX_RETRIES attempts"
                  exit 1
                fi
                
                echo "Attempt $RETRY_COUNT/$MAX_RETRIES: OpenSearch not ready, waiting..."
                sleep 10
              done
              
              echo "OpenSearch is ready!"
              
              # Check if security index already exists
              SECURITY_STATUS=$(curl -sk \
                --cacert /tls/ca.crt \
                -u admin:${ADMIN_PASSWORD} \
                https://opensearch.rag-pipeline.svc.cluster.local:9200/_plugins/_security/health \
                2>/dev/null || echo "")
              
              if echo "$SECURITY_STATUS" | grep -q '"status":"UP"'; then
                echo "Security plugin already initialized, checking if update needed..."
              fi
              
              # Run securityadmin to apply configuration
              echo "Applying security configuration..."
              
              cd /usr/share/opensearch/plugins/opensearch-security/tools/
              
              chmod +x securityadmin.sh
              
              ./securityadmin.sh \
                -cd /security-config/ \
                -icl \
                -nhnv \
                -cacert /tls/ca.crt \
                -cert /tls/admin/tls.crt \
                -key /tls/admin/tls.key \
                -h opensearch.rag-pipeline.svc.cluster.local \
                -p 9200
              
              echo "=== Security configuration applied successfully ==="
              
              # Verify configuration
              echo "Verifying security configuration..."
              
              # Check cluster health
              HEALTH=$(curl -sk \
                --cacert /tls/ca.crt \
                -u admin:${ADMIN_PASSWORD} \
                https://opensearch.rag-pipeline.svc.cluster.local:9200/_cluster/health)
              echo "Cluster health: $HEALTH"
              
              # Check security plugin status
              SECURITY=$(curl -sk \
                --cacert /tls/ca.crt \
                -u admin:${ADMIN_PASSWORD} \
                https://opensearch.rag-pipeline.svc.cluster.local:9200/_plugins/_security/health)
              echo "Security status: $SECURITY"
              
              # List configured users
              USERS=$(curl -sk \
                --cacert /tls/ca.crt \
                -u admin:${ADMIN_PASSWORD} \
                https://opensearch.rag-pipeline.svc.cluster.local:9200/_plugins/_security/api/internalusers)
              echo "Configured users: $USERS"
              
              echo "=== Initialization complete ==="
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-security-secrets
                  key: admin-password
          volumeMounts:
            - name: security-config
              mountPath: /security-config
              readOnly: true
            - name: ca-cert
              mountPath: /tls
              readOnly: true
            - name: admin-cert
              mountPath: /tls/admin
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: security-config
          configMap:
            name: opensearch-security-config
        - name: ca-cert
          secret:
            secretName: opensearch-ca-secret
            items:
              - key: ca.crt
                path: ca.crt
        - name: admin-cert
          secret:
            secretName: opensearch-admin-tls-secret
