# OpenSearch Bootstrap Job
# =========================
# Creates index templates, custom analyzers, and initial indices.
# Run after OpenSearch is ready but before ingesting documents.

apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-bootstrap
  namespace: rag-pipeline
  labels:
    app: opensearch
    component: bootstrap
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: opensearch-bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-opensearch
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for OpenSearch to be ready..."
              until wget -q -O- http://opensearch:9200/_cluster/health 2>/dev/null | grep -q '"status":"green"\|"status":"yellow"'; do
                echo "OpenSearch not ready, waiting..."
                sleep 5
              done
              echo "OpenSearch is ready!"
      containers:
        - name: bootstrap
          image: curlimages/curl:8.5.0
          env:
            - name: OPENSEARCH_URL
              value: "http://opensearch:9200"
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-security-secrets
                  key: rag-user-username
                  optional: true
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-security-secrets
                  key: rag-user-password
                  optional: true
            - name: OPENSEARCH_SECURITY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: OPENSEARCH_SECURITY_ENABLED
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "=== OpenSearch Bootstrap Script ==="
              echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              
              # Build auth and URL based on security config
              CURL_AUTH=""
              CURL_URL="$OPENSEARCH_URL"
              
              if [ "$OPENSEARCH_SECURITY_ENABLED" = "true" ]; then
                echo "Security enabled, using HTTPS and authentication..."
                CURL_URL="https://opensearch:9200"
                if [ -n "$OPENSEARCH_USERNAME" ] && [ -n "$OPENSEARCH_PASSWORD" ]; then
                  CURL_AUTH="-u $OPENSEARCH_USERNAME:$OPENSEARCH_PASSWORD"
                fi
                CURL_OPTS="-k"
              else
                echo "Security disabled, using HTTP..."
                CURL_OPTS=""
              fi
              
              # ========================================
              # Documents Index Template
              # ========================================
              echo ""
              echo ">>> Creating documents index template..."
              curl -X PUT "$CURL_URL/_index_template/documents-template" \
                $CURL_AUTH $CURL_OPTS \
                -H "Content-Type: application/json" \
                -d '{
                  "index_patterns": ["documents-*"],
                  "priority": 100,
                  "template": {
                    "settings": {
                      "number_of_shards": 3,
                      "number_of_replicas": 1,
                      "refresh_interval": "5s",
                      "analysis": {
                        "analyzer": {
                          "rag_standard": {
                            "type": "custom",
                            "tokenizer": "standard",
                            "filter": ["lowercase", "asciifolding", "english_stemmer", "english_stop"]
                          },
                          "autocomplete": {
                            "type": "custom",
                            "tokenizer": "autocomplete_tokenizer",
                            "filter": ["lowercase", "asciifolding"]
                          },
                          "autocomplete_search": {
                            "type": "custom",
                            "tokenizer": "standard",
                            "filter": ["lowercase", "asciifolding"]
                          },
                          "code_analyzer": {
                            "type": "custom",
                            "tokenizer": "code_tokenizer",
                            "filter": ["lowercase"]
                          }
                        },
                        "tokenizer": {
                          "autocomplete_tokenizer": {
                            "type": "edge_ngram",
                            "min_gram": 2,
                            "max_gram": 20,
                            "token_chars": ["letter", "digit"]
                          },
                          "code_tokenizer": {
                            "type": "pattern",
                            "pattern": "[^\\\\w\\\\d]+"
                          }
                        },
                        "filter": {
                          "english_stemmer": {
                            "type": "stemmer",
                            "language": "english"
                          },
                          "english_stop": {
                            "type": "stop",
                            "stopwords": "_english_"
                          }
                        }
                      }
                    },
                    "mappings": {
                      "properties": {
                        "document_id": {
                          "type": "keyword"
                        },
                        "tenant_id": {
                          "type": "keyword"
                        },
                        "title": {
                          "type": "text",
                          "analyzer": "rag_standard",
                          "fields": {
                            "keyword": { "type": "keyword" },
                            "autocomplete": {
                              "type": "text",
                              "analyzer": "autocomplete",
                              "search_analyzer": "autocomplete_search"
                            }
                          }
                        },
                        "description": {
                          "type": "text",
                          "analyzer": "rag_standard"
                        },
                        "source_type": {
                          "type": "keyword"
                        },
                        "source_url": {
                          "type": "keyword"
                        },
                        "visibility": {
                          "type": "keyword"
                        },
                        "allowed_groups": {
                          "type": "keyword"
                        },
                        "tags": {
                          "type": "keyword"
                        },
                        "metadata": {
                          "type": "object",
                          "dynamic": true
                        },
                        "file_size": {
                          "type": "long"
                        },
                        "file_type": {
                          "type": "keyword"
                        },
                        "chunk_count": {
                          "type": "integer"
                        },
                        "created_at": {
                          "type": "date"
                        },
                        "updated_at": {
                          "type": "date"
                        },
                        "indexed_at": {
                          "type": "date"
                        }
                      }
                    }
                  }
                }'
              
              # ========================================
              # Chunks Index Template
              # ========================================
              echo ""
              echo ">>> Creating chunks index template..."
              curl -X PUT "$CURL_URL/_index_template/chunks-template" \
                $CURL_AUTH $CURL_OPTS \
                -H "Content-Type: application/json" \
                -d '{
                  "index_patterns": ["chunks-*"],
                  "priority": 100,
                  "template": {
                    "settings": {
                      "number_of_shards": 3,
                      "number_of_replicas": 1,
                      "refresh_interval": "5s",
                      "analysis": {
                        "analyzer": {
                          "rag_standard": {
                            "type": "custom",
                            "tokenizer": "standard",
                            "filter": ["lowercase", "asciifolding", "english_stemmer", "english_stop"]
                          },
                          "code_analyzer": {
                            "type": "custom",
                            "tokenizer": "code_tokenizer",
                            "filter": ["lowercase"]
                          }
                        },
                        "tokenizer": {
                          "code_tokenizer": {
                            "type": "pattern",
                            "pattern": "[^\\\\w\\\\d]+"
                          }
                        },
                        "filter": {
                          "english_stemmer": {
                            "type": "stemmer",
                            "language": "english"
                          },
                          "english_stop": {
                            "type": "stop",
                            "stopwords": "_english_"
                          }
                        }
                      }
                    },
                    "mappings": {
                      "properties": {
                        "chunk_id": {
                          "type": "keyword"
                        },
                        "document_id": {
                          "type": "keyword"
                        },
                        "tenant_id": {
                          "type": "keyword"
                        },
                        "chunk_index": {
                          "type": "integer"
                        },
                        "content": {
                          "type": "text",
                          "analyzer": "rag_standard"
                        },
                        "content_type": {
                          "type": "keyword"
                        },
                        "token_count": {
                          "type": "integer"
                        },
                        "char_count": {
                          "type": "integer"
                        },
                        "start_char": {
                          "type": "integer"
                        },
                        "end_char": {
                          "type": "integer"
                        },
                        "page_number": {
                          "type": "integer"
                        },
                        "section_title": {
                          "type": "text",
                          "fields": {
                            "keyword": { "type": "keyword" }
                          }
                        },
                        "parent_chunk_id": {
                          "type": "keyword"
                        },
                        "metadata": {
                          "type": "object",
                          "dynamic": true
                        },
                        "visibility": {
                          "type": "keyword"
                        },
                        "allowed_groups": {
                          "type": "keyword"
                        },
                        "created_at": {
                          "type": "date"
                        }
                      }
                    }
                  }
                }'
              
              # ========================================
              # Create Initial Indices
              # ========================================
              echo ""
              echo ">>> Creating initial documents index..."
              curl -X PUT "$CURL_URL/documents-default" \
                $CURL_AUTH $CURL_OPTS \
                -H "Content-Type: application/json" \
                -d '{}' || echo "(index may already exist)"
              
              echo ""
              echo ">>> Creating initial chunks index..."
              curl -X PUT "$CURL_URL/chunks-default" \
                $CURL_AUTH $CURL_OPTS \
                -H "Content-Type: application/json" \
                -d '{}' || echo "(index may already exist)"
              
              # ========================================
              # Verification
              # ========================================
              echo ""
              echo ">>> Verifying index templates..."
              curl -s "$CURL_URL/_index_template?pretty" $CURL_AUTH $CURL_OPTS | head -50
              
              echo ""
              echo ">>> Listing indices..."
              curl -s "$CURL_URL/_cat/indices?v" $CURL_AUTH $CURL_OPTS
              
              echo ""
              echo ">>> Testing autocomplete analyzer..."
              curl -s -X POST "$CURL_URL/documents-default/_analyze" \
                $CURL_AUTH $CURL_OPTS \
                -H "Content-Type: application/json" \
                -d '{"analyzer": "autocomplete", "text": "machine learning"}' | head -20
              
              echo ""
              echo "=== Bootstrap Complete ==="
