apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: rag-pipeline
  labels:
    app: opensearch
spec:
  type: ClusterIP
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: opensearch
---
# Headless service for StatefulSet DNS discovery
apiVersion: v1
kind: Service
metadata:
  name: opensearch-headless
  namespace: rag-pipeline
  labels:
    app: opensearch
spec:
  clusterIP: None
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: opensearch
