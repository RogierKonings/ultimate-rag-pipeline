# OpenSearch Index Lifecycle Management Policies
# ===============================================
# Manages index rotation, warmup, and deletion.

apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-ilm-policies
  namespace: rag-pipeline
  labels:
    app: opensearch
    component: ilm
data:
  documents-policy.json: |
    {
      "policy": {
        "description": "Documents index lifecycle policy",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [
              {
                "rollover": {
                  "min_index_age": "30d",
                  "min_primary_shard_size": "50gb"
                }
              }
            ],
            "transitions": [
              {
                "state_name": "warm",
                "conditions": {
                  "min_index_age": "30d"
                }
              }
            ]
          },
          {
            "name": "warm",
            "actions": [
              {
                "replica_count": {
                  "number_of_replicas": 1
                }
              },
              {
                "force_merge": {
                  "max_num_segments": 1
                }
              }
            ],
            "transitions": [
              {
                "state_name": "cold",
                "conditions": {
                  "min_index_age": "90d"
                }
              }
            ]
          },
          {
            "name": "cold",
            "actions": [
              {
                "read_only": {}
              }
            ],
            "transitions": [
              {
                "state_name": "delete",
                "conditions": {
                  "min_index_age": "365d"
                }
              }
            ]
          },
          {
            "name": "delete",
            "actions": [
              {
                "delete": {}
              }
            ]
          }
        ],
        "ism_template": [
          {
            "index_patterns": ["documents-*"],
            "priority": 100
          }
        ]
      }
    }

  chunks-policy.json: |
    {
      "policy": {
        "description": "Chunks index lifecycle policy",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [
              {
                "rollover": {
                  "min_index_age": "30d",
                  "min_primary_shard_size": "100gb"
                }
              }
            ],
            "transitions": [
              {
                "state_name": "warm",
                "conditions": {
                  "min_index_age": "30d"
                }
              }
            ]
          },
          {
            "name": "warm",
            "actions": [
              {
                "replica_count": {
                  "number_of_replicas": 1
                }
              },
              {
                "force_merge": {
                  "max_num_segments": 1
                }
              }
            ],
            "transitions": [
              {
                "state_name": "cold",
                "conditions": {
                  "min_index_age": "90d"
                }
              }
            ]
          },
          {
            "name": "cold",
            "actions": [
              {
                "read_only": {}
              }
            ],
            "transitions": [
              {
                "state_name": "delete",
                "conditions": {
                  "min_index_age": "365d"
                }
              }
            ]
          },
          {
            "name": "delete",
            "actions": [
              {
                "delete": {}
              }
            ]
          }
        ],
        "ism_template": [
          {
            "index_patterns": ["chunks-*"],
            "priority": 100
          }
        ]
      }
    }

  apply-ilm-policies.sh: |
    #!/bin/bash
    # Apply ILM policies to OpenSearch
    set -e
    
    OPENSEARCH_URL="${OPENSEARCH_URL:-http://opensearch:9200}"
    CURL_AUTH=""
    CURL_OPTS=""
    
    if [ "$OPENSEARCH_SECURITY_ENABLED" = "true" ]; then
      OPENSEARCH_URL="https://opensearch:9200"
      if [ -n "$OPENSEARCH_USERNAME" ] && [ -n "$OPENSEARCH_PASSWORD" ]; then
        CURL_AUTH="-u $OPENSEARCH_USERNAME:$OPENSEARCH_PASSWORD"
      fi
      CURL_OPTS="-k"
    fi
    
    echo "Applying documents ILM policy..."
    curl -X PUT "$OPENSEARCH_URL/_plugins/_ism/policies/documents-policy" \
      $CURL_AUTH $CURL_OPTS \
      -H "Content-Type: application/json" \
      -d @/config/documents-policy.json
    
    echo ""
    echo "Applying chunks ILM policy..."
    curl -X PUT "$OPENSEARCH_URL/_plugins/_ism/policies/chunks-policy" \
      $CURL_AUTH $CURL_OPTS \
      -H "Content-Type: application/json" \
      -d @/config/chunks-policy.json
    
    echo ""
    echo "Verifying policies..."
    curl -s "$OPENSEARCH_URL/_plugins/_ism/policies" $CURL_AUTH $CURL_OPTS
    
    echo ""
    echo "ILM policies applied successfully!"
