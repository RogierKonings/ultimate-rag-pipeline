# EKS Overlay
# ============
# Kustomization for Amazon Elastic Kubernetes Service deployments.
# Uses EBS CSI driver with encryption enabled.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Patch all PVCs to use EKS encrypted storage class
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: encrypted-gp3

# EKS-specific configurations
configMapGenerator:
  - name: cloud-provider-config
    namespace: rag-pipeline
    literals:
      - CLOUD_PROVIDER=eks
      - STORAGE_CLASS=encrypted-gp3
      - ENCRYPTION_TYPE=aws-kms

# Labels for EKS resources
commonLabels:
  cloud-provider: eks
  environment: production
