apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: rag-pipeline
  labels:
    app: orchestrator-service
    component: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orchestrator-service
        component: orchestrator
    spec:
      serviceAccountName: orchestrator-service
      containers:
        - name: orchestrator-service
          image: rag-orchestrator:latest
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: RETRIEVAL_SERVICE_URL
              value: "http://retrieval-service:8002"
            - name: LLM_GATEWAY_URL
              value: "http://llm-gateway:8004"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: redis-password
            - name: QDRANT_URL
              value: "http://qdrant:6334"
            - name: OPENSEARCH_URL
              value: "http://opensearch:9200"
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: minio-secret-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
