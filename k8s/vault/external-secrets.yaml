# External Secrets Operator Configuration
# ========================================
# This file configures External Secrets Operator (ESO) for declarative
# secrets synchronization from HashiCorp Vault to Kubernetes Secrets.
#
# Prerequisites:
# 1. Install External Secrets Operator:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets \
#      --namespace external-secrets --create-namespace
#
# 2. Configure Vault Kubernetes auth (see vault-agent.yaml)
#
# Implements US-10.7.3: Secret Management - Dynamic Secret Injection (AC-2)

---
# ClusterSecretStore - Shared Vault backend for all namespaces
# ============================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: secrets
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      # Use Kubernetes authentication
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "rag-pipeline"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
      # Optional: TLS configuration
      # caBundle: "<base64-encoded-ca-cert>"
      # caProvider:
      #   type: Secret
      #   name: vault-ca
      #   key: ca.crt
      #   namespace: vault

---
# SecretStore - Namespace-scoped Vault backend (alternative to ClusterSecretStore)
# =================================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-local
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: secrets
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "rag-pipeline"
          serviceAccountRef:
            name: "rag-pipeline-sa"

---
# External Secret: Database Credentials
# =====================================
# Syncs database credentials from Vault to Kubernetes Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: database
spec:
  # Refresh interval - how often to sync from Vault
  refreshInterval: "1h"

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  # Target Kubernetes Secret configuration
  target:
    name: database-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: rag-pipeline
          app.kubernetes.io/component: database
          managed-by: external-secrets
      # Transform data into environment variables
      data:
        DATABASE_URL: "postgresql+asyncpg://{{ .postgres_user }}:{{ .postgres_password }}@{{ .host | default \"postgres.rag-pipeline.svc\" }}:{{ .port | default \"5432\" }}/{{ .database | default \"ragpipeline\" }}"

  # Data mappings from Vault to Secret keys
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: rag-pipeline/database
        property: postgres_user

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: rag-pipeline/database
        property: postgres_password

    - secretKey: POSTGRES_HOST
      remoteRef:
        key: rag-pipeline/database
        property: host
        decodingStrategy: None

    - secretKey: POSTGRES_PORT
      remoteRef:
        key: rag-pipeline/database
        property: port
        decodingStrategy: None

    - secretKey: POSTGRES_DB
      remoteRef:
        key: rag-pipeline/database
        property: database
        decodingStrategy: None

---
# External Secret: Redis Credentials
# ===================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: cache
spec:
  refreshInterval: "1h"

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .password }}@{{ .host | default \"redis.rag-pipeline.svc\" }}:{{ .port | default \"6379\" }}"

  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: rag-pipeline/redis
        property: password

    - secretKey: REDIS_HOST
      remoteRef:
        key: rag-pipeline/redis
        property: host

    - secretKey: REDIS_PORT
      remoteRef:
        key: rag-pipeline/redis
        property: port

---
# External Secret: OpenSearch Credentials
# ========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opensearch-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: search
spec:
  refreshInterval: "1h"

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: opensearch-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_URL: "https://{{ .username | default \"admin\" }}:{{ .password }}@{{ .host | default \"opensearch.rag-pipeline.svc\" }}:{{ .port | default \"9200\" }}"

  data:
    - secretKey: OPENSEARCH_USER
      remoteRef:
        key: rag-pipeline/opensearch
        property: username

    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: rag-pipeline/opensearch
        property: password

---
# External Secret: LLM API Keys
# ==============================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: llm
spec:
  refreshInterval: "1h"

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: api-credentials
    creationPolicy: Owner

  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: rag-pipeline/llm
        property: openai_api_key

    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: rag-pipeline/llm
        property: anthropic_api_key

---
# External Secret: MinIO/S3 Credentials
# ======================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: storage
spec:
  refreshInterval: "1h"

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: minio-credentials
    creationPolicy: Owner

  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: rag-pipeline/minio
        property: access_key

    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: rag-pipeline/minio
        property: secret_key

    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: rag-pipeline/minio
        property: access_key

    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: rag-pipeline/minio
        property: secret_key

---
# External Secret: Authentication/JWT Secrets
# ============================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: auth
spec:
  refreshInterval: "6h"  # Less frequent for auth keys

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: auth-secrets
    creationPolicy: Owner

  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: rag-pipeline/auth
        property: jwt_secret

    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: rag-pipeline/auth
        property: jwt_private_key

    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: rag-pipeline/auth
        property: jwt_public_key

---
# External Secret: Service-to-Service Authentication
# ===================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-auth-secrets
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: auth
spec:
  refreshInterval: "1h"

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  target:
    name: service-auth-secrets
    creationPolicy: Owner

  data:
    - secretKey: SERVICE_JWT_SECRET
      remoteRef:
        key: rag-pipeline/service-auth
        property: jwt_secret

---
