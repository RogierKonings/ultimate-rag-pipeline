apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: rag-pipeline
  labels:
    app: retrieval-service
    component: retrieval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retrieval-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: retrieval-service
        component: retrieval
    spec:
      serviceAccountName: retrieval-service
      containers:
        - name: retrieval-service
          image: rag-retrieval:latest
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: RUST_LOG
              value: "info,rag_retrieval=debug"
            - name: RETRIEVAL_HOST
              value: "0.0.0.0"
            - name: RETRIEVAL_PORT
              value: "8002"
            - name: QDRANT_URL
              value: "http://qdrant:6334"
            - name: QDRANT_COLLECTION
              value: "documents"
            - name: OPENSEARCH_URL
              value: "http://opensearch:9200"
            - name: OPENSEARCH_INDEX
              value: "documents"
            - name: EMBEDDING_SERVICE_URL
              value: "http://embedding-service:8080"
            - name: EMBEDDING_MODEL
              value: "all-MiniLM-L6-v2"
            - name: EMBEDDING_DIMENSIONS
              value: "384"
            - name: RERANKER_ENABLED
              value: "true"
            - name: RERANKER_GATEWAY_URL
              value: "http://llm-gateway:8004"
            - name: HYBRID_SEMANTIC_WEIGHT
              value: "0.7"
            - name: HYBRID_KEYWORD_WEIGHT
              value: "0.3"
            - name: HYBRID_FUSION_METHOD
              value: "rrf"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
