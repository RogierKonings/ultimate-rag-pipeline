apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: rag-pipeline
  labels:
    app: redis
    component: cache
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    port 6379
    protected-mode yes

    # Persistence
    appendonly yes
    appendfsync everysec
    save 60 1000

    # Memory
    maxmemory 1gb
    maxmemory-policy allkeys-lru

    # Replication
    replica-read-only yes

    # Logging
    loglevel notice

    # Note: requirepass is set via command-line args in statefulset
    # to allow dynamic injection from secrets

  redis-tls.conf: |
    # Network - TLS only (disable plaintext port)
    bind 0.0.0.0
    port 0
    protected-mode yes

    # TLS Configuration
    tls-port 6379
    tls-cert-file /tls/tls.crt
    tls-key-file /tls/tls.key
    tls-ca-cert-file /tls/ca.crt
    tls-auth-clients optional
    tls-protocols "TLSv1.2 TLSv1.3"
    tls-ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    tls-ciphersuites "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    tls-prefer-server-ciphers yes
    tls-replication yes

    # Persistence
    appendonly yes
    appendfsync everysec
    save 60 1000

    # Memory
    maxmemory 1gb
    maxmemory-policy allkeys-lru

    # Replication
    replica-read-only yes

    # Logging
    loglevel notice

  start-redis.sh: |
    #!/bin/sh
    set -e
    
    # Determine which config to use based on TLS_ENABLED
    if [ "$TLS_ENABLED" = "true" ] && [ -f /tls/tls.crt ]; then
      echo "Starting Redis with TLS enabled"
      CONFIG_FILE=/etc/redis/redis-tls.conf
    else
      echo "Starting Redis without TLS"
      CONFIG_FILE=/etc/redis/redis.conf
    fi
    
    # Copy config to writable location
    cp $CONFIG_FILE /tmp/redis.conf
    
    # Inject password into redis config at runtime
    if [ -n "$REDIS_PASSWORD" ]; then
      echo "requirepass $REDIS_PASSWORD" >> /tmp/redis.conf
      echo "masterauth $REDIS_PASSWORD" >> /tmp/redis.conf
    fi
    
    # Set replica announce IP
    if [ -n "$POD_IP" ]; then
      echo "replica-announce-ip $POD_IP" >> /tmp/redis.conf
    fi
    
    # Determine if this pod is the master (redis-0) or a replica
    HOSTNAME=$(hostname)
    if [ "$HOSTNAME" != "redis-0" ]; then
      # This is a replica, configure replication
      echo "replicaof redis-0.redis.rag-pipeline.svc.cluster.local 6379" >> /tmp/redis.conf
      echo "Starting as replica of redis-0"
    else
      echo "Starting as master (redis-0)"
    fi
    
    exec redis-server /tmp/redis.conf
