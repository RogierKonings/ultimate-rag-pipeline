[package]
name = "rag-ingestion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Document parsing, chunking, embedding, and indexing for RAG pipeline"

[dependencies]
# Internal crates
rag-types = { path = "../rag-types" }
rag-config = { path = "../rag-config" }
rag-vectorstore = { path = "../rag-vectorstore" }
rag-search = { path = "../rag-search" }
rag-database = { path = "../rag-database" }

# Parsing
scraper = "0.20"
ego-tree = "0.6"
pulldown-cmark = "0.12"
serde_yaml = "0.9"
# PDF parsing
pdf-extract = "0.8"
# DOCX parsing (Office Open XML)
quick-xml = "0.31"
zip = "0.6"

# Tokenization
tiktoken-rs = "0.6"
# Sentence segmentation
unicode-segmentation = "1.10"
# PII detection
regex = "1.10"
lazy_static = "1.4"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["fs"] }

# HTTP client
reqwest = { workspace = true }

# AWS S3
aws-sdk-s3 = "1.65"
aws-config = { version = "1.5", features = ["behavior-version-latest"] }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
bytes = "1.5"
mime_guess = "2.0"
async-trait = "0.1"
tracing = { workspace = true }

# API server
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }

# Job tracking
dashmap = "5.5"
tokio-util = { version = "0.7", features = ["rt"] }

# Worker system
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
futures = "0.3"

# Logging (for binary)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1.4"
wiremock = "0.5"
tempfile = "3.10"
tokio-test = { workspace = true }

[[bin]]
name = "ingestion-api"
path = "src/bin/ingestion-api.rs"

[lints]
workspace = true
