[package]
name = "rag-retrieval"
description = "Retrieval algorithms for RAG Pipeline - RRF fusion, reranking, hybrid search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Internal crates
rag-types = { path = "../rag-types", features = ["axum"] }
rag-vectorstore = { path = "../rag-vectorstore" }
rag-search = { path = "../rag-search" }
rag-cache = { path = "../rag-cache" }
rag-auth = { path = "../rag-auth" }
rag-config = { path = "../rag-config" }
rag-telemetry = { path = "../rag-telemetry" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { workspace = true }

# HTTP client for embedding service
reqwest = { workspace = true }

# API framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

# Parallel processing
rayon = "1.11"

# Unicode normalization
unicode-normalization = "0.1"

# Hashing for cache keys
sha2 = "0.10"
hex = "0.4"

# Observability
prometheus = "0.14"
once_cell = "1.19"
opentelemetry = { version = "0.31", features = ["trace"] }

# OpenAPI schema generation (optional)
utoipa = { version = "5", optional = true }

# Memory profiling (optional)
dhat = { version = "0.3", optional = true }

[features]
default = []
openapi = ["utoipa"]
memory-profiling = ["dhat"]

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
proptest = "1.4"
wiremock = "0.6"

[[bench]]
name = "rrf_benchmark"
harness = false

[[bench]]
name = "fusion_benchmark"
harness = false

[[bench]]
name = "pipeline_benchmark"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false
required-features = ["memory-profiling"]

[[bin]]
name = "retrieval-service"
path = "src/bin/main.rs"

[lints]
workspace = true
