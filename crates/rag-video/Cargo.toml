[package]
name = "rag-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Video processing pipeline for RAG: extraction, OCR, fusion, and indexing"

[dependencies]
# Internal crates
rag-types = { path = "../rag-types" }
rag-vectorstore = { path = "../rag-vectorstore" }
rag-ingestion = { path = "../rag-ingestion" }

# Async runtime
tokio = { workspace = true, features = ["fs", "process"] }

# HTTP client
reqwest = { workspace = true }

# Qdrant (pinned to match rag-vectorstore for API compatibility)
qdrant-client = "1.16"

# Parallelism
rayon = "1.11"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tempfile = "3.24"

[dev-dependencies]
wiremock = "0.6"
tokio-test = { workspace = true }
pretty_assertions = "1.4"

[lints]
workspace = true
