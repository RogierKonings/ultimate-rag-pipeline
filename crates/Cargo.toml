[workspace]
resolver = "2"
members = [
    "rag-types",
    "rag-config",
    "rag-cache",
    "rag-retrieval",
    "rag-auth",
    "rag-telemetry",
    "rag-storage",
    "rag-vectorstore",
    "rag-search",
    "rag-database",
    "rag-ingestion",
    "rag-video",
    "rag-embedding",
    "rag-tenant",
    "rag-secrets",
    "rag-encryption",
    "rag-llm-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/your-org/ultimate-rag-pipeline"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# UUID
uuid = { version = "1.20", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Redis
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
tokio-test = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Lint groups with lower priority so individual lints can override
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow some pedantic/nursery lints that are overly strict or noisy
missing_const_for_fn = "allow"  # Too strict for library code
significant_drop_tightening = "allow"  # False positives with locks
redundant_clone = "allow"  # Sometimes necessary for borrow checker
must_use_candidate = "allow"  # Too noisy for all functions
missing_errors_doc = "allow"  # Doc requirements too strict for internal code
future_not_send = "allow"  # Not all futures need to be Send
or_fun_call = "allow"  # Sometimes clearer to use unwrap_or with fn
cast_possible_wrap = "allow"  # u64 to i64 is intentional in some cases
cast_sign_loss = "allow"  # Often intentional
cast_precision_loss = "allow"  # f64 to usize is often intentional
single_match_else = "allow"  # Match is often clearer than if let
option_if_let_else = "allow"  # Not always clearer
indexing_slicing = "allow"  # We validate bounds elsewhere
match_on_vec_items = "allow"  # We validate bounds elsewhere
unnecessary_lazy_evaluations = "allow"  # Often clearer with closures
unnecessary_map_or = "allow"  # map_or style preference
match_like_matches_macro = "allow"  # Sometimes match is clearer
