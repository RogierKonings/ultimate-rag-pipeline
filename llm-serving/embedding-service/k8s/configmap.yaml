apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-service-config
  namespace: llm-serving
  labels:
    app: embedding-service
data:
  MODEL_NAME: "BAAI/bge-large-en-v1.5"
  EMBEDDING_DIM: "1024"
  MAX_SEQUENCE_LENGTH: "512"
  MAX_BATCH_SIZE: "32"
  MAX_BATCH_TOKENS: "8192"
  BATCH_TIMEOUT_MS: "50"
  USE_FP16: "true"
  DEVICE: "cuda"
  MAX_QUEUE_SIZE: "1000"
