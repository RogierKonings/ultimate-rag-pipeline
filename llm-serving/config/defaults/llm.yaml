# Default LLM Serving Configuration
# This file contains the default configuration for all model endpoints

endpoints:
  # Primary LLM endpoint
  qwen-7b-primary:
    type: llm
    model_id: Qwen/Qwen2.5-7B-Instruct
    endpoint_url: http://vllm:8000
    version: "1.0.0"
    enabled: true
    description: "Primary Qwen 2.5 7B Instruct model"
    llm_config:
      temperature: 0.7
      top_p: 1.0
      top_k: 50
      max_tokens: 1024
      frequency_penalty: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
      stop_sequences: []
      stream: true
    timeout_seconds: 60.0
    max_retries: 3
    tags:
      - production
      - primary

  # BGE Large Embedding endpoint
  bge-large-embedding:
    type: embedding
    model_id: BAAI/bge-large-en-v1.5
    endpoint_url: http://embedding-service:8001
    version: "1.0.0"
    enabled: true
    description: "BGE Large embedding model - 1024 dimensions"
    embedding_config:
      normalize: true
      batch_size: 32
      max_sequence_length: 512
      use_fp16: true
      prefix_query: "query: "
      prefix_passage: "passage: "
    timeout_seconds: 30.0
    max_retries: 3
    tags:
      - production

  # BGE Reranker endpoint
  bge-reranker:
    type: reranker
    model_id: BAAI/bge-reranker-v2-m3
    endpoint_url: http://reranker-service:8002
    version: "1.0.0"
    enabled: true
    description: "BGE Reranker v2 M3 model"
    reranker_config:
      max_pairs_per_request: 100
      max_sequence_length: 512
      batch_size: 32
      normalize_scores: false
      use_fp16: true
    timeout_seconds: 30.0
    max_retries: 3
    tags:
      - production

# A/B tests (initially empty)
ab_tests: []
