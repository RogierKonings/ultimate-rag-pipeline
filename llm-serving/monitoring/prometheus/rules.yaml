# Prometheus Alerting Rules for LLM Serving Layer
# These rules define alerts for health, performance, and resource issues

groups:
  - name: llm-serving-health
    interval: 30s
    rules:
      # Model Health Alerts
      - alert: ModelNotLoaded
        expr: llm_model_loaded == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Model not loaded on {{ $labels.service }}"
          description: "Model {{ $labels.model }} has not been loaded for more than 2 minutes."

      - alert: HealthCheckFailing
        expr: up{job=~"vllm|embedding|reranker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Health check endpoint is not responding for {{ $labels.job }}."

  - name: llm-serving-latency
    interval: 30s
    rules:
      # Latency Alerts
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(llm_request_latency_seconds_bucket[5m])) by (le, service, model)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "P95 request latency is {{ $value | printf \"%.2f\" }}s (threshold: 2s)."

      - alert: CriticalRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(llm_request_latency_seconds_bucket[5m])) by (le, service, model)
          ) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical P95 latency on {{ $labels.service }}"
          description: "P95 request latency is {{ $value | printf \"%.2f\" }}s (threshold: 5s)."

      - alert: HighTimeToFirstToken
        expr: |
          histogram_quantile(0.95,
            sum(rate(llm_time_to_first_token_seconds_bucket[5m])) by (le, service, model)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High time to first token on {{ $labels.service }}"
          description: "P95 TTFT is {{ $value | printf \"%.2f\" }}s for model {{ $labels.model }}."

  - name: llm-serving-errors
    interval: 30s
    rules:
      # Error Rate Alerts
      - alert: HighErrorRate
        expr: |
          sum(rate(llm_requests_total{status="error"}[5m])) by (service, model) /
          sum(rate(llm_requests_total[5m])) by (service, model) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% for model {{ $labels.model }}."

      - alert: CriticalErrorRate
        expr: |
          sum(rate(llm_requests_total{status="error"}[5m])) by (service, model) /
          sum(rate(llm_requests_total[5m])) by (service, model) > 0.15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% for model {{ $labels.model }}."

      - alert: NoRequests
        expr: |
          sum(rate(llm_requests_total[10m])) by (service) == 0
          and on(service) llm_model_loaded == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No requests received by {{ $labels.service }}"
          description: "Service {{ $labels.service }} has received no requests in 15 minutes despite model being loaded."

  - name: llm-serving-gpu
    interval: 30s
    rules:
      # GPU Alerts
      - alert: HighGPUMemoryUsage
        expr: |
          (llm_gpu_memory_used_bytes / llm_gpu_memory_total_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GPU memory usage on GPU {{ $labels.gpu_id }}"
          description: "GPU memory usage is {{ $value | printf \"%.1f\" }}%."

      - alert: CriticalGPUMemoryUsage
        expr: |
          (llm_gpu_memory_used_bytes / llm_gpu_memory_total_bytes) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical GPU memory usage on GPU {{ $labels.gpu_id }}"
          description: "GPU memory usage is {{ $value | printf \"%.1f\" }}%. Risk of OOM."

      - alert: GPUOverheating
        expr: llm_gpu_temperature_celsius > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu_id }} overheating"
          description: "GPU temperature is {{ $value }}°C (threshold: 85°C)."

      - alert: GPUCriticalTemperature
        expr: llm_gpu_temperature_celsius > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu_id }} critical temperature"
          description: "GPU temperature is {{ $value }}°C. Thermal throttling likely."

      - alert: LowGPUUtilization
        expr: |
          llm_gpu_utilization_percent < 20
          and on() llm_queue_size > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low GPU utilization with pending requests"
          description: "GPU {{ $labels.gpu_id }} is at {{ $value | printf \"%.0f\" }}% utilization but queue has pending requests."

  - name: llm-serving-queue
    interval: 15s
    rules:
      # Queue Alerts
      - alert: QueueBacklog
        expr: llm_queue_size{queue_type="request"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Request queue backlog on {{ $labels.service }}"
          description: "Queue size is {{ $value }} requests."

      - alert: CriticalQueueBacklog
        expr: llm_queue_size{queue_type="request"} > 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical queue backlog on {{ $labels.service }}"
          description: "Queue size is {{ $value }} requests. Consider scaling up."

      - alert: HighQueueWaitTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(llm_queue_wait_seconds_bucket[5m])) by (le, service)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High queue wait time on {{ $labels.service }}"
          description: "P95 queue wait time is {{ $value | printf \"%.2f\" }}s."

  - name: llm-serving-throughput
    interval: 30s
    rules:
      # Throughput Alerts
      - alert: LowTokenThroughput
        expr: |
          llm_tokens_per_second < 100
          and on(service) llm_model_loaded == 1
          and on(service) rate(llm_requests_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low token throughput on {{ $labels.service }}"
          description: "Token throughput is {{ $value | printf \"%.0f\" }} tokens/sec."

      - alert: LowBatchEfficiency
        expr: |
          histogram_quantile(0.5,
            sum(rate(llm_batch_size_bucket[10m])) by (le, service)
          ) < 4
          and on(service) rate(llm_requests_total[10m]) > 1
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Low batch efficiency on {{ $labels.service }}"
          description: "Median batch size is {{ $value | printf \"%.1f\" }}. Consider adjusting batch timeout."

  - name: llm-serving-cache
    interval: 60s
    rules:
      # Cache Alerts
      - alert: LowCacheHitRate
        expr: |
          sum(rate(llm_cache_hits_total[10m])) by (service, cache_type) /
          (sum(rate(llm_cache_hits_total[10m])) by (service, cache_type) +
           sum(rate(llm_cache_misses_total[10m])) by (service, cache_type)) < 0.5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Low cache hit rate for {{ $labels.cache_type }} on {{ $labels.service }}"
          description: "Cache hit rate is {{ $value | printf \"%.1f\" }}%."

  - name: llm-serving-resources
    interval: 30s
    rules:
      # Resource Alerts (for container metrics from cAdvisor/kubelet)
      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{container=~"vllm|embedding|reranker"}[5m])) by (container, pod)
          / sum(container_spec_cpu_quota{container=~"vllm|embedding|reranker"}/container_spec_cpu_period{container=~"vllm|embedding|reranker"}) by (container, pod)
          > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage for {{ $labels.container }}"
          description: "Container is using {{ $value | printf \"%.0f\" }}% of CPU limit."

      - alert: HighMemoryUsage
        expr: |
          sum(container_memory_working_set_bytes{container=~"vllm|embedding|reranker"}) by (container, pod)
          / sum(container_spec_memory_limit_bytes{container=~"vllm|embedding|reranker"}) by (container, pod)
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage for {{ $labels.container }}"
          description: "Container is using {{ $value | printf \"%.0f\" }}% of memory limit."
