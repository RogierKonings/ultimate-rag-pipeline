apiVersion: v1
kind: ConfigMap
metadata:
  name: reranker-service-config
  namespace: llm-serving
  labels:
    app: reranker-service
data:
  MODEL_NAME: "BAAI/bge-reranker-v2-m3"
  MAX_SEQUENCE_LENGTH: "512"
  MAX_BATCH_SIZE: "32"
  BATCH_TIMEOUT_MS: "50"
  USE_FP16: "true"
  DEVICE: "cuda"
  NORMALIZE_SCORES: "false"
  MAX_QUEUE_SIZE: "1000"
