# LLM Serving Layer - CPU-only Development
# Use this for development without GPU

version: "3.8"

services:
  # =============================================================================
  # Embedding Service (CPU mode)
  # =============================================================================
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    image: localhost:5000/llm-serving/embedding-service:latest
    container_name: embedding-service
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=BAAI/bge-large-en-v1.5
      - EMBEDDING_DIM=1024
      - MAX_SEQUENCE_LENGTH=512
      - MAX_BATCH_SIZE=8
      - MAX_BATCH_TOKENS=2048
      - BATCH_TIMEOUT_MS=100
      - USE_FP16=false
      - DEVICE=cpu
      - MAX_QUEUE_SIZE=100
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - llm-network

  # =============================================================================
  # Reranker Service (CPU mode)
  # =============================================================================
  reranker-service:
    build:
      context: ./reranker-service
      dockerfile: Dockerfile
    image: localhost:5000/llm-serving/reranker-service:latest
    container_name: reranker-service
    ports:
      - "8002:8002"
    environment:
      - MODEL_NAME=BAAI/bge-reranker-v2-m3
      - MAX_SEQUENCE_LENGTH=512
      - MAX_BATCH_SIZE=8
      - BATCH_TIMEOUT_MS=100
      - USE_FP16=false
      - DEVICE=cpu
      - NORMALIZE_SCORES=false
      - MAX_QUEUE_SIZE=100
    volumes:
      - reranker-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - llm-network

  # =============================================================================
  # Ollama for local LLM inference (CPU alternative to vLLM)
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - llm-network

volumes:
  embedding-model-cache:
    driver: local
  reranker-model-cache:
    driver: local
  ollama-models:
    driver: local

networks:
  llm-network:
    driver: bridge
