apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-critical
value: 1000000
globalDefault: false
description: "Critical LLM serving workloads - highest priority"
preemptionPolicy: PreemptLowerPriority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-standard
value: 100000
globalDefault: false
description: "Standard LLM serving workloads"
preemptionPolicy: PreemptLowerPriority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-batch
value: 10000
globalDefault: false
description: "Batch/background LLM workloads - lowest priority"
preemptionPolicy: Never
