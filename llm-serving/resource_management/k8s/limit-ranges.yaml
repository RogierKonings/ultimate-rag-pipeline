apiVersion: v1
kind: LimitRange
metadata:
  name: llm-serving-limits
  namespace: llm-serving
spec:
  limits:
    # Default container limits
    - type: Container
      default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      max:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "2"
      min:
        cpu: "100m"
        memory: "128Mi"

    # Pod limits
    - type: Pod
      max:
        cpu: "32"
        memory: "128Gi"
        nvidia.com/gpu: "4"
