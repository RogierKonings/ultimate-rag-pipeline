# LLM Serving Layer - Local Development Docker Compose
# Requires NVIDIA GPU with CUDA support

version: "3.8"

services:
  # =============================================================================
  # vLLM Service - LLM Inference (US-5.1)
  # =============================================================================
  vllm:
    build:
      context: ./vllm
      dockerfile: Dockerfile
    image: localhost:5000/llm-serving/vllm:latest
    container_name: vllm
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=Qwen/Qwen2.5-7B-Instruct
      - GPU_MEMORY_UTILIZATION=0.90
      - MAX_MODEL_LEN=8192
      - MAX_NUM_SEQS=256
      - TENSOR_PARALLEL_SIZE=1
    volumes:
      - vllm-model-cache:/models
      - /dev/shm:/dev/shm:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - llm-network

  # =============================================================================
  # Embedding Service (US-5.2)
  # =============================================================================
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    image: localhost:5000/llm-serving/embedding-service:latest
    container_name: embedding-service
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=BAAI/bge-large-en-v1.5
      - EMBEDDING_DIM=1024
      - MAX_SEQUENCE_LENGTH=512
      - MAX_BATCH_SIZE=32
      - MAX_BATCH_TOKENS=8192
      - BATCH_TIMEOUT_MS=50
      - USE_FP16=true
      - DEVICE=cuda
      - MAX_QUEUE_SIZE=1000
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - llm-network

  # =============================================================================
  # Reranker Service (US-5.3)
  # =============================================================================
  reranker-service:
    build:
      context: ./reranker-service
      dockerfile: Dockerfile
    image: localhost:5000/llm-serving/reranker-service:latest
    container_name: reranker-service
    ports:
      - "8002:8002"
    environment:
      - MODEL_NAME=BAAI/bge-reranker-v2-m3
      - MAX_SEQUENCE_LENGTH=512
      - MAX_BATCH_SIZE=32
      - BATCH_TIMEOUT_MS=50
      - USE_FP16=true
      - DEVICE=cuda
      - NORMALIZE_SCORES=false
      - MAX_QUEUE_SIZE=1000
    volumes:
      - reranker-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - llm-network

  # =============================================================================
  # Local Registry (for development)
  # =============================================================================
  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped
    networks:
      - llm-network

volumes:
  vllm-model-cache:
    driver: local
  embedding-model-cache:
    driver: local
  reranker-model-cache:
    driver: local
  registry-data:
    driver: local

networks:
  llm-network:
    driver: bridge
