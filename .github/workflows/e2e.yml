name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:tests/e2e/docker-compose.e2e.yaml

jobs:
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=raguser
          POSTGRES_PASSWORD=ragpass
          POSTGRES_DB=ragpipeline
          REDIS_PASSWORD=ragredis
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin123
          LLM_MODEL=llama3.1:8b
          EOF

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for infrastructure
        run: |
          echo "Waiting for infrastructure services..."
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U raguser 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 5
          done

      - name: Start application services
        run: docker compose --profile app up -d

      - name: Wait for application services
        run: |
          echo "Waiting for application services..."
          for i in $(seq 1 60); do
            HEALTHY=true
            for port in 8001 8002 8003; do
              curl -sf http://localhost:$port/health > /dev/null 2>&1 || HEALTHY=false
            done
            if [ "$HEALTHY" = true ]; then
              echo "All services healthy"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done

      - name: Run E2E tests
        run: docker compose --profile e2e run --rm e2e-tests

      - name: Collect logs on failure
        if: failure()
        run: |
          for svc in ingestion-service retrieval-service orchestrator-service; do
            echo "=== $svc ==="
            docker compose logs $svc --tail=100
          done

      - name: Teardown
        if: always()
        run: docker compose --profile app --profile e2e down -v
