name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:tests/e2e/docker-compose.e2e.yaml

jobs:
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=raguser
          POSTGRES_PASSWORD=ragpass
          POSTGRES_DB=ragpipeline
          REDIS_PASSWORD=ragredis
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin123
          LLM_MODEL=llama3.1:8b
          EOF

      - name: Start infrastructure
        run: docker compose up -d

      # Build all 3 Rust services from a single unified Dockerfile.
      # This runs cargo chef cook + cargo build ONCE instead of 3x.
      # The first target (embedding) does the heavy build; the 2nd and 3rd
      # reuse all cached builder layers via GHA cache and only run the
      # lightweight runtime stage.
      - name: Build Rust services (embedding)
        uses: docker/build-push-action@v6
        with:
          context: ./crates
          file: ./crates/Dockerfile.ci
          push: false
          load: true
          target: embedding-runtime
          tags: rag-embedding:latest
          cache-from: type=gha,scope=rust-ci
          cache-to: type=gha,scope=rust-ci,mode=max

      - name: Build Rust services (ingestion)
        uses: docker/build-push-action@v6
        with:
          context: ./crates
          file: ./crates/Dockerfile.ci
          push: false
          load: true
          target: ingestion-runtime
          tags: rag-ingestion:latest
          cache-from: type=gha,scope=rust-ci

      - name: Build Rust services (retrieval)
        uses: docker/build-push-action@v6
        with:
          context: ./crates
          file: ./crates/Dockerfile.ci
          push: false
          load: true
          target: retrieval-runtime
          tags: rag-retrieval:latest
          cache-from: type=gha,scope=rust-ci

      - name: Build orchestrator service
        uses: docker/build-push-action@v6
        with:
          context: ./services/orchestrator
          file: ./services/orchestrator/Dockerfile
          push: false
          load: true
          tags: rag-orchestrator:latest
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,scope=orchestrator,mode=max

      - name: Wait for infrastructure
        run: |
          echo "Waiting for infrastructure services..."
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U raguser 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Start application services
        run: docker compose up -d --no-build ingestion-service retrieval-service orchestrator-service embedding-service

      - name: Wait for application services
        run: |
          echo "Waiting for application services..."
          MAX_WAIT=180
          INTERVAL=2
          ELAPSED=0

          # Use /health/ready for retrieval (checks search backends only, skips slow reranker probes)
          # Use /health for ingestion and orchestrator
          check_service() {
            local port=$1
            local endpoint="/health"
            if [ "$port" = "8002" ]; then
              endpoint="/health/ready"
            fi
            curl -sf --max-time 5 "http://localhost:${port}${endpoint}" > /dev/null 2>&1
          }

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_HEALTHY=true
            for port in 8001 8002 8003; do
              if ! check_service $port; then
                ALL_HEALTHY=false
                break
              fi
            done

            if [ "$ALL_HEALTHY" = true ]; then
              echo "All services healthy after ${ELAPSED}s"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            echo "Waiting for services... (${ELAPSED}s/${MAX_WAIT}s)"
          done

          if [ "$ALL_HEALTHY" != true ]; then
            echo "ERROR: Services did not become healthy within ${MAX_WAIT}s"
            echo "--- Container status ---"
            docker compose ps
            for port in 8001 8002 8003; do
              echo "Port $port /health: $(curl -s --max-time 5 http://localhost:$port/health 2>&1 || echo 'UNREACHABLE')"
              echo "Port $port /health/ready: $(curl -s --max-time 5 http://localhost:$port/health/ready 2>&1 || echo 'UNREACHABLE')"
            done
            exit 1
          fi

      - name: Run E2E tests
        run: docker compose --profile e2e --profile app run --rm e2e-tests

      - name: Collect logs on failure
        if: failure()
        run: |
          for svc in ingestion-service retrieval-service orchestrator-service embedding-service mock-llm; do
            echo "=== $svc ==="
            docker compose logs $svc --tail=100
          done

      - name: Teardown
        if: always()
        run: docker compose --profile e2e --profile app down -v
