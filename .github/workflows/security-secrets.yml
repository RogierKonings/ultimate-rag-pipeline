# Security Secrets Detection Workflow
# Scans for accidentally committed secrets using Gitleaks and TruffleHog
name: Security - Secrets Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 5:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Run Gitleaks with custom config
        run: |
          # Install gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz

          # Run scan with custom config if exists, otherwise use defaults
          if [ -f ".gitleaks.toml" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --report-format sarif --report-path gitleaks-results.sarif --no-git || true
          else
            ./gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --no-git || true
          fi

      - name: Upload Gitleaks results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
        if: always()
        continue-on-error: true

      - name: Run Gitleaks JSON report
        run: |
          if [ -f ".gitleaks.toml" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --report-format json --report-path gitleaks-full.json --no-git || true
          else
            ./gitleaks detect --source . --report-format json --report-path gitleaks-full.json --no-git || true
          fi

      - name: Upload Gitleaks JSON results
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: |
            gitleaks-results.sarif
            gitleaks-full.json
          retention-days: 30
        if: always()

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --only-verified
        continue-on-error: true

      - name: Run TruffleHog filesystem scan
        run: |
          # Install trufflehog
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

          # Scan filesystem for secrets
          trufflehog filesystem . \
            --json \
            --no-verification \
            > trufflehog-results.json 2>&1 || true

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 30
        if: always()

  detect-secrets:
    name: Yelp detect-secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '\.git/.*' \
            --exclude-files '\.venv/.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*-lock\.json$' \
            > detect-secrets-results.json || true

      - name: Upload detect-secrets results
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-results
          path: detect-secrets-results.json
          retention-days: 30

  secrets-summary:
    name: Secrets Detection Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, detect-secrets]
    if: always()
    steps:
      - name: Download Gitleaks results
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results
        continue-on-error: true

      - name: Download TruffleHog results
        uses: actions/download-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results
        continue-on-error: true

      - name: Download detect-secrets results
        uses: actions/download-artifact@v4
        with:
          name: detect-secrets-results
          path: detect-secrets-results
        continue-on-error: true

      - name: Generate Summary
        run: |
          echo "## Secrets Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tool Status" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| detect-secrets | ${{ needs.detect-secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for findings
          echo "### Findings Summary" >> $GITHUB_STEP_SUMMARY

          if [ -f "gitleaks-results/gitleaks-full.json" ]; then
            GITLEAKS_COUNT=$(cat gitleaks-results/gitleaks-full.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null || echo "0")
            echo "- Gitleaks findings: $GITLEAKS_COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$GITLEAKS_COUNT" -gt 0 ]; then
              echo "::warning::Gitleaks detected $GITLEAKS_COUNT potential secrets"
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "1. Review all findings in the Security tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Rotate any exposed credentials immediately" >> $GITHUB_STEP_SUMMARY
          echo "3. Add legitimate secrets to allowlist in .gitleaks.toml" >> $GITHUB_STEP_SUMMARY

      - name: Fail on secrets found (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -f "gitleaks-results/gitleaks-full.json" ]; then
            GITLEAKS_COUNT=$(cat gitleaks-results/gitleaks-full.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null || echo "0")
            if [ "$GITLEAKS_COUNT" -gt 0 ]; then
              echo "::error::Secrets detected in codebase. Please remove and rotate."
              # Uncomment to fail the build
              # exit 1
            fi
          fi
