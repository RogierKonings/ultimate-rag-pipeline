name: Moon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MOON_TOOLCHAIN_FORCE_GLOBALS: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for affected detection

      - name: Setup proto
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache Moon
        uses: moonrepo/cache@v0

      - name: Run CI
        run: moon ci

  # Separate job for affected-only runs on PRs
  affected:
    name: Affected Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup proto
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Show affected projects
        run: moon query projects --affected

      - name: Run affected tests
        run: moon run :test --affected

      - name: Run affected lints
        run: moon run :lint --affected
