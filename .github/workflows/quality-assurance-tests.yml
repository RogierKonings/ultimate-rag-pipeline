# Unit Tests Workflow
# Runs pytest for all services on push and pull requests
name: Quality Assurance - Linting & Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "services/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/quality-assurance-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check services/

      - name: Run ruff format check
        run: ruff format --check services/

  test-ingestion:
    name: Test Ingestion Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/ingestion/requirements.txt
          # Install shared module
          pip install -e services/shared 2>/dev/null || true

      - name: Run tests
        run: |
          pytest services/ingestion/ \
            -v \
            --tb=short \
            -m "not integration and not slow" \
            --ignore=services/ingestion/connectors/tests/test_integration.py \
            --ignore=services/ingestion/embedding/tests/test_integration.py \
            --junitxml=test-results-ingestion.xml \
            --cov=services/ingestion \
            --cov-report=xml:coverage-ingestion.xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/services:${{ github.workspace }}/services/ingestion

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ingestion
          path: |
            test-results-ingestion.xml
            coverage-ingestion.xml
        if: always()

  test-retrieval:
    name: Test Retrieval Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install core test dependencies
          pip install pytest pytest-asyncio pytest-cov httpx
          # Install from ingestion requirements (has common deps)
          pip install -r services/ingestion/requirements.txt 2>/dev/null || true

      - name: Run tests
        run: |
          pytest services/retrieval/ \
            -v \
            --tb=short \
            -m "not integration and not slow" \
            --junitxml=test-results-retrieval.xml \
            --cov=services/retrieval \
            --cov-report=xml:coverage-retrieval.xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/services:${{ github.workspace }}/services/retrieval

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-retrieval
          path: |
            test-results-retrieval.xml
            coverage-retrieval.xml
        if: always()

  test-orchestrator:
    name: Test Orchestrator Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/orchestrator/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/orchestrator/requirements.txt
          # Install shared module
          pip install -e services/shared 2>/dev/null || true

      - name: Run tests
        run: |
          pytest services/orchestrator/ \
            -v \
            --tb=short \
            -m "not integration and not slow" \
            --junitxml=test-results-orchestrator.xml \
            --cov=services/orchestrator \
            --cov-report=xml:coverage-orchestrator.xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/services:${{ github.workspace }}/services/orchestrator

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-orchestrator
          path: |
            test-results-orchestrator.xml
            coverage-orchestrator.xml
        if: always()

  test-shared:
    name: Test Shared Module
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install core test dependencies
          pip install pytest pytest-asyncio pytest-cov
          # Install from ingestion requirements (has common deps)
          pip install -r services/ingestion/requirements.txt 2>/dev/null || true

      - name: Run tests
        run: |
          pytest services/shared/ \
            -v \
            --tb=short \
            -m "not integration and not slow" \
            --junitxml=test-results-shared.xml \
            --cov=services/shared \
            --cov-report=xml:coverage-shared.xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/services
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shared
          path: |
            test-results-shared.xml
            coverage-shared.xml
        if: always()

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-ingestion, test-retrieval, test-orchestrator, test-shared]
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
        continue-on-error: true

      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ingestion | ${{ needs.test-ingestion.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Retrieval | ${{ needs.test-retrieval.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Orchestrator | ${{ needs.test-orchestrator.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared | ${{ needs.test-shared.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          if [[ "${{ needs.test-ingestion.result }}" == "failure" ]] || \
             [[ "${{ needs.test-retrieval.result }}" == "failure" ]] || \
             [[ "${{ needs.test-orchestrator.result }}" == "failure" ]]; then
            echo "::error::One or more test suites failed"
            exit 1
          fi
