# Security Dependency Scanning Workflow
# Scans Python dependencies for known vulnerabilities
name: Security - Dependency Scan

on:
  push:
    branches: [main, develop]
    paths:
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/Pipfile.lock'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  pip-audit:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan ingestion service
        run: |
          pip-audit -r services/ingestion/requirements.txt \
            --format json \
            --output ingestion-audit.json || true
        continue-on-error: true

      - name: Scan retrieval service
        run: |
          pip-audit -r services/retrieval/requirements.txt \
            --format json \
            --output retrieval-audit.json || true
        continue-on-error: true

      - name: Scan orchestrator service
        run: |
          pip-audit -r services/orchestrator/requirements.txt \
            --format json \
            --output orchestrator-audit.json || true
        continue-on-error: true

      - name: Scan shared module
        run: |
          pip-audit -r services/shared/requirements.txt \
            --format json \
            --output shared-audit.json || true
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: '*-audit.json'
          retention-days: 30

  safety-check:
    name: Safety Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check on all requirements
        run: |
          find . -name "requirements*.txt" -not -path "./.venv/*" | while read req; do
            echo "Checking $req..."
            safety check -r "$req" --output json > "$(basename $req .txt)-safety.json" 2>&1 || true
          done
        continue-on-error: true

      - name: Upload Safety results
        uses: actions/upload-artifact@v4
        with:
          name: safety-results
          path: '*-safety.json'
          retention-days: 30

  snyk-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-licenses: GPL-3.0, AGPL-3.0

  summary:
    name: Dependency Scan Summary
    runs-on: ubuntu-latest
    needs: [pip-audit, safety-check]
    if: always()
    steps:
      - name: Download pip-audit results
        uses: actions/download-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results
        continue-on-error: true

      - name: Download Safety results
        uses: actions/download-artifact@v4
        with:
          name: safety-results
          path: safety-results
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "## Dependency Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### pip-audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -d "pip-audit-results" ]; then
            for f in pip-audit-results/*.json; do
              if [ -f "$f" ]; then
                echo "#### $(basename $f .json)" >> $GITHUB_STEP_SUMMARY
                cat "$f" | head -50 >> $GITHUB_STEP_SUMMARY || echo "No results" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "No pip-audit results found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Safety Results" >> $GITHUB_STEP_SUMMARY
          if [ -d "safety-results" ]; then
            for f in safety-results/*.json; do
              if [ -f "$f" ]; then
                echo "#### $(basename $f .json)" >> $GITHUB_STEP_SUMMARY
                cat "$f" | head -50 >> $GITHUB_STEP_SUMMARY || echo "No results" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "No Safety results found" >> $GITHUB_STEP_SUMMARY
          fi
