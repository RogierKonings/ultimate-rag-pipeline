# E2E Tests Workflow
# Runs end-to-end smoke tests against the full RAG pipeline
name: Quality Assurance - E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly regression run on Sundays at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:tests/e2e/docker-compose.e2e.yaml

jobs:
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=raguser
          POSTGRES_PASSWORD=ragpass
          POSTGRES_DB=ragpipeline
          REDIS_PASSWORD=ragredis
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin123
          LLM_MODEL=llama3.1:8b
          EOF

      - name: Start infrastructure services
        run: docker compose up -d

      - name: Wait for infrastructure
        run: |
          echo "Waiting for infrastructure services..."
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U raguser 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 5
          done

      - name: Start application services
        run: docker compose --profile app up -d

      - name: Wait for application services
        run: |
          echo "Waiting for application services to be healthy..."
          for i in {1..60}; do
            HEALTHY=true
            
            # Check ingestion service
            if ! curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              HEALTHY=false
            fi
            
            # Check orchestrator service
            if ! curl -sf http://localhost:8003/health > /dev/null 2>&1; then
              HEALTHY=false
            fi
            
            # Check retrieval service
            if ! curl -sf http://localhost:8002/health > /dev/null 2>&1; then
              HEALTHY=false
            fi
            
            if [ "$HEALTHY" = true ]; then
              echo "All services are healthy!"
              break
            fi
            
            echo "Waiting for services... ($i/60)"
            sleep 5
          done

      - name: Run E2E tests
        run: |
          docker compose --profile e2e run --rm e2e-tests

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Ingestion Service Logs ==="
          docker compose logs ingestion-service --tail=100
          echo "=== Orchestrator Service Logs ==="
          docker compose logs orchestrator-service --tail=100
          echo "=== Retrieval Service Logs ==="
          docker compose logs retrieval-service --tail=100

      - name: Generate test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Stop services
        if: always()
        run: docker compose --profile app --profile e2e down -v
