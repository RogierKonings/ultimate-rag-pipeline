name: Setup Toolchain
description: Install Moon, Rust, Python, Node.js, and uv for CI

runs:
  using: composite
  steps:
    - name: Setup proto & Moon
      uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.93.0'
        components: clippy, rustfmt

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@9.15.0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python tools
      shell: bash
      run: uv pip install --system ruff
