services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config.yaml:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__PATH: /qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragpipeline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragpipeline}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: rag-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - cluster.name=rag-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: rag-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    command: >
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --requirepass ${REDIS_PASSWORD:-ragredis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ragredis}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: rag-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ============ APPLICATION SERVICES ============
  # NOTE: Run 'make env-docker' before 'docker-compose --profile app up' to generate .env

  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: rag-ingestion
    ports:
      - "8001:8001"
    env_file:
      - .env.base
      - .env.docker
    environment:
      # Service-specific overrides
      - LOG_LEVEL=DEBUG
    volumes:
      - ./services/ingestion:/app
      - ./services/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-network
    profiles:
      - app

  ingestion-worker:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: rag-ingestion-worker
    command: celery -A tasks worker -l info -c 2
    env_file:
      - .env.base
      - .env.docker
    volumes:
      - ./services/ingestion:/app
      - ./services/shared:/app/shared
    depends_on:
      - redis
      - ingestion-service
    networks:
      - rag-network
    profiles:
      - app

  retrieval-service:
    build:
      context: .
      dockerfile: crates/rag-retrieval/Dockerfile
    container_name: rag-retrieval
    ports:
      - "8002:8002"
    environment:
      # Qdrant configuration
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=documents
      # OpenSearch configuration
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=documents
      # Embedding service
      - EMBEDDING_SERVICE_URL=http://embedding-service:8080
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSIONS=384
      # Reranker configuration
      - RERANKER_ENABLED=false
      - RERANKER_GATEWAY_URL=http://host.docker.internal:8004
      # Server configuration
      - RETRIEVAL_HOST=0.0.0.0
      - RETRIEVAL_PORT=8002
      - RUST_LOG=info,rag_retrieval=debug
      # Hybrid search weights
      - HYBRID_SEMANTIC_WEIGHT=0.7
      - HYBRID_KEYWORD_WEIGHT=0.3
      - HYBRID_FUSION_METHOD=rrf
    depends_on:
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    profiles:
      - app

  orchestrator-service:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: rag-orchestrator
    ports:
      - "8003:8003"
    env_file:
      - .env.base
      - .env.docker
    environment:
      # Service-specific overrides (model config)
      - ORCHESTRATOR_DEFAULT_MODEL=${LLM_MODEL:-llama3.1:8b}
      - ORCHESTRATOR_FALLBACK_MODEL=llama3.2:3b
      - ORCHESTRATOR_SMALL_MODEL=llama3.2:3b
      - ORCHESTRATOR_MEDIUM_MODEL=llama3.1:8b
      - ORCHESTRATOR_LARGE_MODEL=qwen2.5:14b
      - LOG_LEVEL=DEBUG
    volumes:
      - ./services/orchestrator:/app
      - ./services/shared:/app/shared
    depends_on:
      - retrieval-service
      - redis
    networks:
      - rag-network
    profiles:
      - app

  # ============ ML SERVICES (CPU versions for local dev) ============
  embedding-service:
    build:
      context: ./services/embedding
      dockerfile: Dockerfile.cpu
    container_name: rag-embedding
    ports:
      - "8080:8080"
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - MAX_BATCH_SIZE=32
    volumes:
      - model_cache:/root/.cache/huggingface
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    profiles:
      - app

  # NOTE: For GPU acceleration on Apple Silicon, run Ollama natively (not in Docker)
  # Docker containers cannot access Metal GPU. Install Ollama from https://ollama.ai
  # The services below connect to native Ollama via host.docker.internal:11434
  #
  # To use Docker-based Ollama (CPU only, slower), uncomment this service and change
  # all LLM_GATEWAY_URL references from host.docker.internal:11434 to llm-gateway:11434
  #
  # llm-gateway:
  #   image: ollama/ollama:latest
  #   container_name: rag-ollama
  #   ports:
  #     - "8004:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=4
  #     - OLLAMA_MAX_LOADED_MODELS=2
  #     - OLLAMA_FLASH_ATTENTION=1
  #     - OLLAMA_KEEP_ALIVE=5m
  #   networks:
  #     - rag-network
  #   profiles:
  #     - app

  # ============ FRONTEND ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.base
      - .env.docker
    depends_on:
      - minio
    networks:
      - rag-network
    profiles:
      - app

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  opensearch_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  model_cache:
    driver: local
  ollama_data:
    driver: local
