services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config.yaml:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__PATH: /qdrant/storage
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragpipeline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragpipeline}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: rag-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - cluster.name=rag-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: rag-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    command: >
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --requirepass ${REDIS_PASSWORD:-ragredis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ragredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: rag-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ============ APPLICATION SERVICES ============
  # NOTE: Run 'make env-docker' before 'docker-compose --profile app up' to generate .env

  ingestion-service:
    image: rag-ingestion:latest
    build:
      context: ./crates
      dockerfile: rag-ingestion/Dockerfile
    container_name: rag-ingestion
    ports:
      - "8001:8001"
    environment:
      - RUST_LOG=info,rag_ingestion=debug
      - TOKIO_WORKER_THREADS=8
      - DATABASE_URL=postgres://raguser:ragpass@postgres:5432/ragpipeline
      - QDRANT_URL=http://qdrant:6334
      - OPENSEARCH_URL=http://opensearch:9200
      - REDIS_URL=redis://:ragredis@redis:6379
      - EMBEDDING_SERVICE_URL=http://embedding-service:8080
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      # AWS SDK credentials for S3 connector
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - AWS_REGION=us-east-1
      - INGESTION_HOST=0.0.0.0
      - INGESTION_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    profiles:
      - app

  retrieval-service:
    image: rag-retrieval:latest
    build:
      context: ./crates
      dockerfile: rag-retrieval/Dockerfile
    container_name: rag-retrieval
    ports:
      - "8002:8002"
    environment:
      # Qdrant configuration (gRPC port for qdrant-client)
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_COLLECTION=documents
      # OpenSearch configuration
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=documents
      # Embedding service
      - EMBEDDING_SERVICE_URL=http://embedding-service:8080
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSIONS=384
      # Reranker configuration
      - RERANKER_ENABLED=true
      - RERANKER_GATEWAY_URL=http://host.docker.internal:8004
      # Server configuration
      - RETRIEVAL_HOST=0.0.0.0
      - RETRIEVAL_PORT=8002
      - RUST_LOG=info,rag_retrieval=debug
      - TOKIO_WORKER_THREADS=8
      # Hybrid search weights
      - HYBRID_SEMANTIC_WEIGHT=0.7
      - HYBRID_KEYWORD_WEIGHT=0.3
      - HYBRID_FUSION_METHOD=rrf
    depends_on:
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    profiles:
      - app

  orchestrator-service:
    image: rag-orchestrator:latest
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: rag-orchestrator
    ports:
      - "8003:8003"
    env_file:
      - .env.base
      - .env.docker
    environment:
      # Service-specific overrides (model config)
      - ORCHESTRATOR_DEFAULT_MODEL=${LLM_MODEL:-qwen2.5:14b}
      - ORCHESTRATOR_FALLBACK_MODEL=llama3.1:8b
      - ORCHESTRATOR_SMALL_MODEL=llama3.2:3b
      - ORCHESTRATOR_MEDIUM_MODEL=llama3.1:8b
      - ORCHESTRATOR_LARGE_MODEL=qwen2.5:14b
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app:/app/shared:/packages
    volumes:
      - ./services/orchestrator:/app
      - ./services/orchestrator:/packages/orchestrator
    depends_on:
      - retrieval-service
      - redis
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    profiles:
      - app

  # ============ ML SERVICES ============
  embedding-service:
    image: rag-embedding:latest
    build:
      context: ./crates
      dockerfile: rag-embedding/Dockerfile
    container_name: rag-embedding
    ports:
      - "8080:8080"
    environment:
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_BATCH_SIZE=32
      - TOKIO_WORKER_THREADS=8
      - EMBEDDING_HOST=0.0.0.0
      - EMBEDDING_PORT=8080
      - RUST_LOG=info
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    profiles:
      - app

  # NOTE: For GPU acceleration on Apple Silicon, run Ollama natively (not in Docker)
  # Docker containers cannot access Metal GPU. Install Ollama from https://ollama.ai
  # The services below connect to native Ollama via host.docker.internal:11434
  #
  # For best performance on Apple Silicon, set these env vars BEFORE starting Ollama:
  #   export OLLAMA_NUM_PARALLEL=4        # Handle 4 concurrent requests (default: 1)
  #   export OLLAMA_FLASH_ATTENTION=1     # Enable flash attention optimization
  #   export OLLAMA_KEEP_ALIVE=10m        # Keep model loaded in GPU memory
  #
  # Add these to ~/.zshrc for persistence, then restart Ollama.
  #
  # To use Docker-based Ollama (CPU only, slower), uncomment this service and change
  # all LLM_GATEWAY_URL references from host.docker.internal:11434 to llm-gateway:11434
  #
  # llm-gateway:
  #   image: ollama/ollama:latest
  #   container_name: rag-ollama
  #   ports:
  #     - "8004:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=4
  #     - OLLAMA_MAX_LOADED_MODELS=2
  #     - OLLAMA_FLASH_ATTENTION=1
  #     - OLLAMA_KEEP_ALIVE=10m
  #   networks:
  #     - rag-network
  #   profiles:
  #     - app

  # ============ FRONTEND ============
  frontend:
    image: rag-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.base
      - .env.docker
    depends_on:
      - minio
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    profiles:
      - app

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  opensearch_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  model_cache:
    driver: local
  ollama_data:
    driver: local
