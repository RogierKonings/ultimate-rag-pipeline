[pytest]
# Test discovery settings
testpaths = tests api connectors embedding indexing migrations processors services tasks
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Exclude shared module tests - these should be run separately
# The shared/config path conflicts with the local config.py module
# Note: shared tests are excluded via testpaths configuration above
