# Alertmanager Configuration
# This file configures alert routing and receivers

global:
  # How long to wait before sending notifications about new alerts
  resolve_timeout: 5m

  # Slack API URL (override with secret in production)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Route tree for alert routing
route:
  # Default receiver
  receiver: 'slack-default'

  # Group alerts by these labels
  group_by: ['alertname', 'service', 'severity']

  # How long to wait before sending initial notification
  group_wait: 30s

  # How long to wait before sending notification about new alerts in group
  group_interval: 5m

  # How long to wait before re-sending notification
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts go to PagerDuty
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true  # Also send to Slack

    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 10s

    # Warning alerts go to Slack
    - match:
        severity: warning
      receiver: 'slack-warning'

    # SLO burn rate alerts get special treatment
    - match:
        alerttype: slo_burn_rate
      receiver: 'slack-slo'
      group_by: ['alertname', 'slo']

    # Informational alerts
    - match:
        severity: info
      receiver: 'slack-info'
      group_interval: 1h
      repeat_interval: 24h

# Inhibition rules
inhibit_rules:
  # Critical alerts suppress warnings for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Infrastructure down suppresses application alerts
  - source_match:
      alertname: 'NodeDown'
    target_match_re:
      alertname: 'RAG.*'
    equal: ['node']

# Receivers
receivers:
  - name: 'slack-default'
    slack_configs:
      - channel: '#rag-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'
        actions:
          - type: button
            text: 'View Runbook'
            url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
          - type: button
            text: 'View Dashboard'
            url: '{{ (index .Alerts 0).Annotations.dashboard_url }}'

  - name: 'slack-critical'
    slack_configs:
      - channel: '#rag-alerts-critical'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  - name: 'slack-warning'
    slack_configs:
      - channel: '#rag-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  - name: 'slack-slo'
    slack_configs:
      - channel: '#rag-slo-alerts'
        send_resolved: true
        title: '{{ template "slack.slo.title" . }}'
        text: '{{ template "slack.slo.text" . }}'
        color: '{{ template "slack.color" . }}'

  - name: 'slack-info'
    slack_configs:
      - channel: '#rag-alerts-info'
        send_resolved: false
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        severity: critical
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          alertname: '{{ .GroupLabels.alertname }}'
          service: '{{ .GroupLabels.service }}'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
