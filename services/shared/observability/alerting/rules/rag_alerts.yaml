# RAG Pipeline Alert Rules
groups:
  - name: rag-application-alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: RAGHighErrorRate
        expr: |
          sum(rate(rag_query_total{status="error"}[5m]))
          / sum(rate(rag_query_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: rag-pipeline
        annotations:
          summary: "High error rate detected in RAG pipeline"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes, threshold is 5%"
          runbook_url: "https://wiki.example.com/runbooks/rag/high-error-rate"
          dashboard_url: "http://grafana:3000/d/rag-overview"

      # High Latency
      - alert: RAGHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(rag_query_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: rag-pipeline
        annotations:
          summary: "High latency detected in RAG pipeline"
          description: "P95 latency is {{ $value | humanizeDuration }}, threshold is 2s"
          runbook_url: "https://wiki.example.com/runbooks/rag/high-latency"
          dashboard_url: "http://grafana:3000/d/rag-overview"

      # LLM Provider Errors
      - alert: RAGLLMProviderErrors
        expr: |
          sum(rate(rag_llm_requests_total{status="error"}[5m])) by (provider)
          / sum(rate(rag_llm_requests_total[5m])) by (provider) > 0.1
        for: 5m
        labels:
          severity: critical
          service: llm-gateway
        annotations:
          summary: "High error rate from LLM provider {{ $labels.provider }}"
          description: "{{ $labels.provider }} error rate is {{ $value | humanizePercentage }}, threshold is 10%"
          runbook_url: "https://wiki.example.com/runbooks/rag/llm-provider-errors"
          dashboard_url: "http://grafana:3000/d/rag-llm"

      # High LLM TTFT
      - alert: RAGLLMHighTTFT
        expr: |
          histogram_quantile(0.95,
            sum(rate(rag_llm_ttft_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: llm-gateway
        annotations:
          summary: "High time-to-first-token in LLM responses"
          description: "P95 TTFT is {{ $value | humanizeDuration }}, threshold is 2s"
          runbook_url: "https://wiki.example.com/runbooks/rag/llm-high-ttft"
          dashboard_url: "http://grafana:3000/d/rag-llm"

      # Zero Results Rate
      - alert: RAGRetrievalZeroResults
        expr: |
          sum(rate(rag_retrieval_result_count{result_count="0"}[15m]))
          / sum(rate(rag_retrieval_duration_seconds_count[15m])) > 0.2
        for: 15m
        labels:
          severity: warning
          service: retrieval
        annotations:
          summary: "High rate of zero-result queries"
          description: "{{ $value | humanizePercentage }} of queries returning zero results, threshold is 20%"
          runbook_url: "https://wiki.example.com/runbooks/rag/zero-results"
          dashboard_url: "http://grafana:3000/d/rag-retrieval"

      # Ingestion Queue Backlog
      - alert: RAGIngestionQueueBacklog
        expr: rag_queue_size{queue="ingestion"} > 1000
        for: 15m
        labels:
          severity: warning
          service: ingestion
        annotations:
          summary: "Large ingestion queue backlog"
          description: "Ingestion queue has {{ $value }} items, threshold is 1000"
          runbook_url: "https://wiki.example.com/runbooks/rag/ingestion-backlog"
          dashboard_url: "http://grafana:3000/d/rag-ingestion"

      # Low Cache Hit Rate
      - alert: RAGCacheLowHitRate
        expr: |
          sum(rate(rag_cache_hits_total[1h]))
          / (sum(rate(rag_cache_hits_total[1h])) + sum(rate(rag_cache_misses_total[1h]))) < 0.5
        for: 1h
        labels:
          severity: warning
          service: rag-pipeline
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}, threshold is 50%"
          runbook_url: "https://wiki.example.com/runbooks/rag/low-cache-hit-rate"
          dashboard_url: "http://grafana:3000/d/rag-overview"

      # Component Health
      - alert: RAGComponentUnhealthy
        expr: rag_component_health == 0
        for: 2m
        labels:
          severity: critical
          service: rag-pipeline
        annotations:
          summary: "RAG component {{ $labels.component }} is unhealthy"
          description: "Component {{ $labels.component }} has been unhealthy for 2 minutes"
          runbook_url: "https://wiki.example.com/runbooks/rag/component-unhealthy"
          dashboard_url: "http://grafana:3000/d/rag-overview"

      # Vector DB Points Drop
      - alert: RAGVectorDBPointsDrop
        expr: |
          (rag_vectordb_points_total - rag_vectordb_points_total offset 1h)
          / rag_vectordb_points_total offset 1h < -0.1
        for: 5m
        labels:
          severity: warning
          service: retrieval
        annotations:
          summary: "Significant drop in vector database points"
          description: "Vector DB points dropped by more than 10% in the last hour"
          runbook_url: "https://wiki.example.com/runbooks/rag/vectordb-points-drop"
          dashboard_url: "http://grafana:3000/d/rag-retrieval"
