# SLO Burn Rate Alert Rules
# Based on Google SRE multi-window, multi-burn-rate alerting
groups:
  - name: slo-burn-rate-alerts
    interval: 30s
    rules:
      # ========================================
      # Query Availability SLO (99.9%)
      # Error budget: 0.1% over 30 days
      # ========================================

      # Fast burn - 14.4x over 1h (2% of budget in 1h)
      - alert: QueryAvailabilityFastBurn
        expr: |
          (
            (1 - (sum(rate(rag_query_total{status="success"}[1h])) / sum(rate(rag_query_total[1h]))))
            / 0.001
          ) > 14.4
          and
          (
            (1 - (sum(rate(rag_query_total{status="success"}[5m])) / sum(rate(rag_query_total[5m]))))
            / 0.001
          ) > 14.4
        for: 2m
        labels:
          severity: critical
          alerttype: slo_burn_rate
          slo: query_availability
          window: 1h
          burn_rate: "14.4"
        annotations:
          summary: "Query availability SLO burning fast"
          description: "Error budget consumption rate is 14.4x normal. At this rate, entire 30-day budget will be exhausted in ~50 hours."
          budget_consumed: "{{ printf \"%.1f\" (mul $value 100) }}% of monthly budget consumed in last hour"
          current_burn_rate: "{{ printf \"%.1f\" $value }}x"
          recommended_actions: |
            1. Check for recent deployments
            2. Investigate error logs for patterns
            3. Consider rollback if deployment-related
          runbook_url: "https://wiki.example.com/runbooks/slo/availability-fast-burn"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"

      # Slow burn - 6x over 6h (5% of budget in 6h)
      - alert: QueryAvailabilitySlowBurn
        expr: |
          (
            (1 - (sum(rate(rag_query_total{status="success"}[6h])) / sum(rate(rag_query_total[6h]))))
            / 0.001
          ) > 6
          and
          (
            (1 - (sum(rate(rag_query_total{status="success"}[30m])) / sum(rate(rag_query_total[30m]))))
            / 0.001
          ) > 6
        for: 15m
        labels:
          severity: warning
          alerttype: slo_burn_rate
          slo: query_availability
          window: 6h
          burn_rate: "6"
        annotations:
          summary: "Query availability SLO burning slowly"
          description: "Error budget consumption rate is 6x normal. At this rate, entire 30-day budget will be exhausted in ~5 days."
          recommended_actions: |
            1. Review error trends
            2. Check for gradual degradation
            3. Plan remediation within 4 hours
          runbook_url: "https://wiki.example.com/runbooks/slo/availability-slow-burn"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"

      # ========================================
      # Query Latency SLO (99% < 2s)
      # Error budget: 1% over 30 days
      # ========================================

      # Fast burn
      - alert: QueryLatencyFastBurn
        expr: |
          (
            (1 - (sum(rate(rag_query_duration_seconds_bucket{le="2"}[1h])) / sum(rate(rag_query_duration_seconds_count[1h]))))
            / 0.01
          ) > 14.4
          and
          (
            (1 - (sum(rate(rag_query_duration_seconds_bucket{le="2"}[5m])) / sum(rate(rag_query_duration_seconds_count[5m]))))
            / 0.01
          ) > 14.4
        for: 2m
        labels:
          severity: critical
          alerttype: slo_burn_rate
          slo: query_latency
          window: 1h
          burn_rate: "14.4"
        annotations:
          summary: "Query latency SLO burning fast"
          description: "More than {{ printf \"%.1f\" (mul (sub 1 (divf (query \"sum(rate(rag_query_duration_seconds_bucket{le=\\\"2\\\"}[1h]))\" nil) (query \"sum(rate(rag_query_duration_seconds_count[1h]))\" nil))) 100) }}% of queries exceeding 2s threshold"
          recommended_actions: |
            1. Check for infrastructure issues
            2. Review recent changes to retrieval/LLM
            3. Scale up if load-related
          runbook_url: "https://wiki.example.com/runbooks/slo/latency-fast-burn"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"

      # Slow burn
      - alert: QueryLatencySlowBurn
        expr: |
          (
            (1 - (sum(rate(rag_query_duration_seconds_bucket{le="2"}[6h])) / sum(rate(rag_query_duration_seconds_count[6h]))))
            / 0.01
          ) > 6
          and
          (
            (1 - (sum(rate(rag_query_duration_seconds_bucket{le="2"}[30m])) / sum(rate(rag_query_duration_seconds_count[30m]))))
            / 0.01
          ) > 6
        for: 15m
        labels:
          severity: warning
          alerttype: slo_burn_rate
          slo: query_latency
          window: 6h
          burn_rate: "6"
        annotations:
          summary: "Query latency SLO burning slowly"
          description: "Sustained high latency consuming error budget"
          recommended_actions: |
            1. Analyze slow query patterns
            2. Review caching effectiveness
            3. Consider optimization work
          runbook_url: "https://wiki.example.com/runbooks/slo/latency-slow-burn"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"

      # ========================================
      # LLM TTFT SLO (95% < 1s)
      # Error budget: 5% over 7 days
      # ========================================

      # Fast burn
      - alert: LLMTTFTFastBurn
        expr: |
          (
            (1 - (sum(rate(rag_llm_ttft_seconds_bucket{le="1"}[1h])) / sum(rate(rag_llm_ttft_seconds_count[1h]))))
            / 0.05
          ) > 14.4
          and
          (
            (1 - (sum(rate(rag_llm_ttft_seconds_bucket{le="1"}[5m])) / sum(rate(rag_llm_ttft_seconds_count[5m]))))
            / 0.05
          ) > 14.4
        for: 2m
        labels:
          severity: critical
          alerttype: slo_burn_rate
          slo: llm_ttft
          window: 1h
          burn_rate: "14.4"
        annotations:
          summary: "LLM TTFT SLO burning fast"
          description: "Time-to-first-token exceeding 1s for many requests"
          recommended_actions: |
            1. Check LLM provider status
            2. Review model configuration
            3. Check for queue buildup
          runbook_url: "https://wiki.example.com/runbooks/slo/ttft-fast-burn"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"

      # ========================================
      # Error Budget Exhaustion Alerts
      # ========================================

      - alert: QueryAvailabilityBudgetExhausted
        expr: |
          1 - (
            (1 - (sum(rate(rag_query_total{status="success"}[30d])) / sum(rate(rag_query_total[30d]))))
            / 0.001
          ) <= 0
        for: 5m
        labels:
          severity: critical
          alerttype: slo_budget_exhausted
          slo: query_availability
        annotations:
          summary: "Query availability error budget exhausted"
          description: "100% of the 30-day error budget has been consumed. SLO is now breached."
          recommended_actions: |
            1. Declare incident
            2. Focus all efforts on reliability
            3. Freeze non-critical changes
          runbook_url: "https://wiki.example.com/runbooks/slo/budget-exhausted"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"

      - alert: QueryLatencyBudgetExhausted
        expr: |
          1 - (
            (1 - (sum(rate(rag_query_duration_seconds_bucket{le="2"}[30d])) / sum(rate(rag_query_duration_seconds_count[30d]))))
            / 0.01
          ) <= 0
        for: 5m
        labels:
          severity: critical
          alerttype: slo_budget_exhausted
          slo: query_latency
        annotations:
          summary: "Query latency error budget exhausted"
          description: "100% of the 30-day error budget has been consumed. SLO is now breached."
          recommended_actions: |
            1. Declare incident
            2. Prioritize latency improvements
            3. Review capacity and scaling
          runbook_url: "https://wiki.example.com/runbooks/slo/budget-exhausted"
          slo_dashboard_url: "http://grafana:3000/d/rag-slo"
