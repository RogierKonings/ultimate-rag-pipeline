# Infrastructure Alert Rules
groups:
  - name: infrastructure-alerts
    interval: 30s
    rules:
      # ========================================
      # Pod/Container Health
      # ========================================

      - alert: PodHighCPU
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="rag-pipeline"}[5m])) by (pod)
          / sum(kube_pod_container_resource_limits{namespace="rag-pipeline", resource="cpu"}) by (pod)
          > 0.9
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} has high CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} of limit"
          runbook_url: "https://wiki.example.com/runbooks/infra/high-cpu"

      - alert: PodHighMemory
        expr: |
          sum(container_memory_working_set_bytes{namespace="rag-pipeline"}) by (pod)
          / sum(kube_pod_container_resource_limits{namespace="rag-pipeline", resource="memory"}) by (pod)
          > 0.9
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} has high memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} of limit"
          runbook_url: "https://wiki.example.com/runbooks/infra/high-memory"

      - alert: PodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="rag-pipeline"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting frequently"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes"
          runbook_url: "https://wiki.example.com/runbooks/infra/restart-loop"

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{namespace="rag-pipeline", condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod has been not ready for 5 minutes"
          runbook_url: "https://wiki.example.com/runbooks/infra/pod-not-ready"

      # ========================================
      # Database Health
      # ========================================

      - alert: PostgreSQLConnectionPoolExhausted
        expr: |
          rag_db_pool_connections_active
          / rag_db_pool_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of connection pool in use"
          runbook_url: "https://wiki.example.com/runbooks/infra/pg-connections"

      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_activity_max_tx_duration{datname="ragpipeline"}[5m]) > 30
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL has slow running queries"
          description: "Queries running longer than 30 seconds"
          runbook_url: "https://wiki.example.com/runbooks/infra/pg-slow-queries"

      # ========================================
      # Vector Database Health
      # ========================================

      - alert: QdrantUnhealthy
        expr: rag_component_health{component="qdrant"} == 0
        for: 2m
        labels:
          severity: critical
          service: qdrant
        annotations:
          summary: "Qdrant vector database is unhealthy"
          description: "Qdrant has been unhealthy for 2 minutes"
          runbook_url: "https://wiki.example.com/runbooks/infra/qdrant-unhealthy"

      - alert: QdrantHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(qdrant_search_duration_seconds_bucket[5m])) by (le)
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          service: qdrant
        annotations:
          summary: "Qdrant search latency is high"
          description: "P95 search latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.example.com/runbooks/infra/qdrant-latency"

      # ========================================
      # Redis/Cache Health
      # ========================================

      - alert: RedisUnhealthy
        expr: rag_component_health{component="redis"} == 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis cache is unhealthy"
          description: "Redis has been unhealthy for 2 minutes"
          runbook_url: "https://wiki.example.com/runbooks/infra/redis-unhealthy"

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"
          runbook_url: "https://wiki.example.com/runbooks/infra/redis-memory"

      # ========================================
      # OpenSearch Health
      # ========================================

      - alert: OpenSearchUnhealthy
        expr: rag_component_health{component="opensearch"} == 0
        for: 2m
        labels:
          severity: critical
          service: opensearch
        annotations:
          summary: "OpenSearch is unhealthy"
          description: "OpenSearch has been unhealthy for 2 minutes"
          runbook_url: "https://wiki.example.com/runbooks/infra/opensearch-unhealthy"

      - alert: OpenSearchClusterYellow
        expr: opensearch_cluster_status == 1
        for: 30m
        labels:
          severity: warning
          service: opensearch
        annotations:
          summary: "OpenSearch cluster status is yellow"
          description: "Cluster has been yellow for 30 minutes"
          runbook_url: "https://wiki.example.com/runbooks/infra/opensearch-yellow"

      - alert: OpenSearchClusterRed
        expr: opensearch_cluster_status == 2
        for: 5m
        labels:
          severity: critical
          service: opensearch
        annotations:
          summary: "OpenSearch cluster status is red"
          description: "Cluster is in red status, data may be unavailable"
          runbook_url: "https://wiki.example.com/runbooks/infra/opensearch-red"

      # ========================================
      # OTEL Collector Health
      # ========================================

      - alert: OTELCollectorBackpressure
        expr: |
          rate(otelcol_processor_dropped_spans[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: otel-collector
        annotations:
          summary: "OTEL Collector dropping spans"
          description: "Collector is dropping {{ $value }} spans/sec due to backpressure"
          runbook_url: "https://wiki.example.com/runbooks/infra/otel-backpressure"

      - alert: OTELCollectorExportFailure
        expr: |
          rate(otelcol_exporter_send_failed_spans[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: otel-collector
        annotations:
          summary: "OTEL Collector export failures"
          description: "Collector failing to export spans"
          runbook_url: "https://wiki.example.com/runbooks/infra/otel-export-failure"

      # ========================================
      # Disk Space
      # ========================================

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 15m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"
          runbook_url: "https://wiki.example.com/runbooks/infra/disk-space"

      - alert: PVCNearlyFull
        expr: |
          kubelet_volume_stats_available_bytes{namespace="rag-pipeline"}
          / kubelet_volume_stats_capacity_bytes{namespace="rag-pipeline"} < 0.1
        for: 15m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} is nearly full"
          description: "Only {{ $value | humanizePercentage }} space remaining"
          runbook_url: "https://wiki.example.com/runbooks/infra/pvc-full"
