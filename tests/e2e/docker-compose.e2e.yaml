# E2E Test Docker Compose Configuration
#
# This file extends the main docker-compose.yml to add an E2E test runner.
# Usage:
#   docker-compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yaml up --profile app -d
#   docker-compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yaml run e2e-tests

services:
  # Override retrieval-service to disable reranker (LLM Gateway not available in E2E)
  retrieval-service:
    environment:
      RERANKER_ENABLED: "false"

  e2e-tests:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    container_name: rag-e2e-tests
    depends_on:
      orchestrator-service:
        condition: service_started
      retrieval-service:
        condition: service_started
      ingestion-service:
        condition: service_started
    environment:
      - INGESTION_URL=http://ingestion-service:8001
      - ORCHESTRATOR_URL=http://orchestrator-service:8003
      - RETRIEVAL_URL=http://retrieval-service:8002
      - E2E_TENANT_ID=00000000-0000-0000-0000-000000000001
      - E2E_INGESTION_TIMEOUT=60
      - E2E_QUERY_TIMEOUT=30
    volumes:
      - ./tests:/tests:ro
    networks:
      - rag-network
    profiles:
      - e2e
    command: [ "pytest", "/tests/e2e/", "-v", "--e2e", "--tb=short" ]
