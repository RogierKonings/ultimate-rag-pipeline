# RAG Pipeline Project Configuration
# This file configures Python development tools

[project]
name = "ultimate-rag-pipeline"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RAG Pipeline Team"}
]
keywords = ["rag", "retrieval", "llm", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/your-org/ultimate-rag-pipeline"
Documentation = "https://github.com/your-org/ultimate-rag-pipeline/tree/main/docs"

# =============================================================================
# Bandit - Python Security Linter
# https://bandit.readthedocs.io/en/latest/config.html
# =============================================================================
[tool.bandit]
# Directories to exclude from scanning
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "node_modules",
    ".pytest_cache",
    ".mypy_cache",
]

# Test IDs to skip globally
# B101: assert_used - We use asserts in tests
# B104: hardcoded_bind_all_interfaces - Acceptable for development/containers
skips = ["B101", "B104"]

# Plugins to load
# Default plugins are used

# Aggregate output by filename
aggregate = "file"

# Number of lines of context to display
number = 3

# Severity level threshold
# Options: all, low, medium, high
severity = "low"

# Confidence level threshold
# Options: all, low, medium, high
confidence = "low"

# =============================================================================
# Ruff - Fast Python Linter
# https://docs.astral.sh/ruff/configuration/
# =============================================================================
[tool.ruff]
# Python version
target-version = "py311"

# Line length
line-length = 100

# Directories to exclude
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "migrations",
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]

# Rules to ignore
ignore = [
    "E501",   # Line too long (handled by formatter)
    "S101",   # Use of assert (acceptable in tests)
    "S104",   # Binding to all interfaces
    "B008",   # Function call in default argument (FastAPI Depends)
    "ARG001", # Unused function argument (often needed for API signatures)
    "ARG002", # Unused method argument (often needed for interface compliance)
]

[tool.ruff.lint.per-file-ignores]
# Test files - ignore security warnings for hardcoded test data and pytest patterns
"tests/**/*.py" = [
    "S101",   # Use of assert
    "S105",   # Hardcoded password strings (test data)
    "S106",   # Hardcoded password in function args (test data)
    "S108",   # Hardcoded temp file paths (test fixtures)
    "S311",   # Suspicious non-cryptographic random (test randomness)
    "S324",   # Insecure hash functions (testing purposes)
    "S608",   # Hardcoded SQL expressions (test queries)
    "S701",   # Jinja2 autoescape (test templates)
    "ARG001", # Unused function arguments (fixtures)
    "ARG002", # Unused method arguments (fixtures)
    "PT011",  # pytest.raises too broad (intentional in some tests)
    "PT028",  # pytest.fixture without value (intentional)
    "B017",   # assertRaises(Exception) too broad (test coverage)
    "A001",   # Variable shadowing builtin (e.g. filter, id in tests)
    "A002",   # Argument shadowing builtin (e.g. filter, id in tests)
]
"**/test_*.py" = [
    "S101", "S105", "S106", "S108", "S311", "S324", "S608", "S701",
    "ARG001", "ARG002", "PT011", "PT028", "B017", "A001", "A002",
]
"**/*_test.py" = [
    "S101", "S105", "S106", "S108", "S311", "S324", "S608", "S701",
    "ARG001", "ARG002", "PT011", "PT028", "B017", "A001", "A002",
]
"**/tests/**/*.py" = [
    "S101", "S105", "S106", "S108", "S311", "S324", "S608", "S701",
    "ARG001", "ARG002", "PT011", "PT028", "B017", "A001", "A002",
]
# Scripts may use hardcoded paths, simpler patterns, and dynamic SQL for exports
"scripts/**/*.py" = ["S108", "S603", "S607", "PTH", "S608"]
# Conftest files often have unused fixtures
"**/conftest.py" = ["ARG001", "ARG002", "S105", "S106"]
# LLM serving uses MD5 for content hashing (not cryptographic), random for A/B testing
"llm-serving/**/*.py" = ["S324", "S311"]
# GPU monitor uses nvidia-smi and parses trusted XML output
"llm-serving/resource_management/gpu_monitor.py" = ["S607", "S314"]
# Warmup/healthcheck scripts use simple try-except-pass patterns
"llm-serving/vllm/scripts/*.py" = ["S110"]
# Ingestion uses content hashing with MD5 for deduplication, database connector uses dynamic SQL
"services/ingestion/**/*.py" = ["S324", "S608"]
# Retrieval cache uses MD5 for cache keys
"services/retrieval/cache/*.py" = ["S324"]
# Query building may use dynamic SQL construction
"services/shared/database/**/*.py" = ["S608"]
# Observability evaluation persistence uses dynamic SQL
"services/shared/observability/evaluation/*.py" = ["S608"]
# Security module implementations
"services/shared/security/**/*.py" = ["S105", "S106", "S311", "S324"]

[tool.ruff.lint.isort]
known-first-party = ["services", "shared"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# =============================================================================
# MyPy - Static Type Checker
# https://mypy.readthedocs.io/en/stable/config_file.html
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests",
    ".venv",
    "venv",
    "migrations",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# =============================================================================
# Pytest - Test Framework
# https://docs.pytest.org/en/stable/reference/customize.html
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks security-related tests",
    "unit: marks unit tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Coverage - Code Coverage
# https://coverage.readthedocs.io/en/latest/config.html
# =============================================================================
[tool.coverage.run]
branch = true
source = ["services"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 70
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# Black - Code Formatter (if used alongside Ruff)
# =============================================================================
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
)/
'''

# =============================================================================
# isort - Import Sorting (if used alongside Ruff)
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "venv", "__pycache__", "migrations"]
known_first_party = ["services", "shared"]

# =============================================================================
# Build System
# =============================================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
